<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <!-- No-flash appearance: apply the saved theme, palette and language before
         first paint (keys match src/lib/appearance.ts and src/lib/i18n.ts). -->
    <script>
      (function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('chaya-theme')
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t)
          // Palette ids are injected by scripts/palettes.mjs; the first is the default (no attribute).
          var ids = /*PALETTE_IDS*/["ember","sapphire","emerald","coral","orchid","amber","teal"]/*END_PALETTE_IDS*/
          var p = localStorage.getItem('chaya-palette')
          if (p !== 'random' && ids.indexOf(p) < 0) p = 'random' // new visitors start on Random
          if (p === 'random') {
            // Keep the current random pick until its period ends (same 30 s – 5 min as src/lib/appearance.ts).
            var s = null
            try { s = JSON.parse(localStorage.getItem('chaya-palette-random')) } catch (e) {}
            if (!s || ids.indexOf(s.id) < 0 || !(s.until > Date.now())) {
              var pool = ids.filter(function (x) { return !s || x !== s.id })
              s = { id: pool[Math.floor(Math.random() * pool.length)], until: Date.now() + (5 + Math.random() * 15) * 60000 }
              localStorage.setItem('chaya-palette-random', JSON.stringify(s))
            }
            p = s.id
          }
          if (p !== ids[0]) d.setAttribute('data-palette', p)
          var l = localStorage.getItem('chaya-lang')
          if (l === 'en' || l === 'bn') d.lang = l
        } catch (e) {}
        try {
          var n = navigator
          if ((n.hardwareConcurrency && n.hardwareConcurrency <= 4) || (n.connection && n.connection.saveData))
            d.classList.add('low-motion')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ছায়া বাড়ি</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
