<style>
  :root {
    --bg: #f6f4f1; --panel: #ffffff; --text: #1d1a17; --muted: #6b645c; --line: #ddd6cc;
    --edge: rgba(29, 26, 23, 0.22); --accent: #c22d27;
    --k-feature: #c22d27; --k-cross: #2f5bc2; --k-integration: #1c7d62; --k-meta: #8a5a06;
    --must: #b91c1c; --should: #a44a06; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0d0c; --panel: #1a1614; --text: #f2ede6; --muted: #a79e94; --line: #2e2825;
      --edge: rgba(242, 237, 230, 0.2); --accent: #ff8a7a;
      --k-feature: #ff8a7a; --k-cross: #83b0f6; --k-integration: #56ce9e; --k-meta: #ebbd56;
      --must: #f87171; --should: #fbbf24; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 1fr minmax(320px, 420px); height: 100vh; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; } }
  #stage { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .toolbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar input { flex: 1 1 180px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; border-radius: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  line { stroke: var(--edge); stroke-width: 1.2; }
  line.hot { stroke: var(--accent); stroke-width: 2; }
  .node circle { stroke: var(--panel); stroke-width: 2; cursor: pointer; }
  .node text { font-size: 11px; fill: var(--text); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .node.dim { opacity: 0.18; }
  .node.sel circle { stroke: var(--text); stroke-width: 3; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 20px; }
  aside h1 { font-size: 20px; margin: 0 0 4px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 6px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-right: 4px; }
  ul { padding-left: 0; list-style: none; margin: 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  li b { font-family: ui-monospace, monospace; font-size: 12px; }
  .must { color: var(--must); } .should { color: var(--should); } .confirmed { color: var(--ok); }
  a.rel { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .hint { color: var(--muted); }
</style>
</head>

 are not security.","more":[]},{"id":"R-ACL-004","meta":{"tokens":["must"]},"text":"Staff (ADMIN/KITCHEN) who open cart, checkout or customer-only pages are sent to their own dashboard. Storefront browsing pages are the exception: an admin sees them in preview mode, under a banner that leads back to the dashboard.","more":[]},{"id":"R-ACL-005","meta":{"tokens":["must"]},"text":"Public tracking links (`/track/:token`) open for anyone, staff included, without logging in.","more":[]}],"decisions":[{"id":"D-ACL-001","meta":{"tokens":["confirmed"],"date":"2026-09-11"},"text":"Keep roles separate from ownership (Phase 0).","more":["Why: both partners are owners, but who can do what in the app must not depend on equity."]},{"id":"D-ACL-002","meta":{"tokens":["confirmed"],"date":"2026-09-26"},"text":"Let admins preview storefront pages as customers see them (commit 8fa3caa).","more":["Why: the owner needs to check the menu and home page without logging out."]}],"questions":[],"ideas":[{"id":"I-ACL-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Add a DELIVERY_RIDER (or \"packer\") role that sees only today's packed orders and can mark them out for delivery or delivered from a phone. This takes routine status taps off the owner.","more":[]}]},{"file":"vault/nodes/addresses.md","id":"addresses","title":"Address book","prefix":"ADR","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/orders/address.service.ts","client/src/components/AddressBook.tsx","client/src/components/AddressBook.css","server/prisma/scripts/orbitax-default-address.sql"],"relations":[{"type":"feeds","to":"checkout","note":"saved addresses auto-fill checkout"}],"summary":"Customers manage saved addresses and pick a default. The phone on an address\nis optional and is backfilled from the profile at checkout. Orbitax accounts\nget their office address pre-filled.","rules":[{"id":"R-ADR-001","meta":{"tokens":["must"]},"text":"Customers see and edit only their own addresses.","more":[]},{"id":"R-ADR-002","meta":{"tokens":["must"]},"text":"Orders snapshot address fields (see R-CHK-003). Address edits never touch existing orders.","more":[]}],"decisions":[{"id":"D-ADR-001","meta":{"tokens":["confirmed"],"date":"2026-09-16"},"text":"Add an address book with checkout auto-fill and an Orbitax default address.","more":["Why: re-typing an address on every order was the main repeat-order friction."]}],"questions":[],"ideas":[{"id":"I-ADR-001","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Let customers label addresses (Home / Office / Mum's) with an icon chip, so the right one is obvious at checkout.","more":[]}]},{"file":"vault/nodes/admin-console.md","id":"admin-console","title":"Admin console (shell & dashboard)","prefix":"ADM","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["client/src/layouts/AdminLayout.tsx","client/src/layouts/AdminLayout.css","client/src/components/AdminSidebar.tsx","client/src/components/AdminIcons.tsx","client/src/pages/AdminDashboard.tsx","client/src/pages/admin/Admin.css","client/src/pages/admin/OrderDetailAdmin.tsx","client/src/lib/overview.ts","server/src/modules/orders/overview.service.ts"],"relations":[{"type":"depends-on","to":"access-control","note":"admin only"},{"type":"uses","to":"orders","note":"counts per step and the needs-action list"},{"type":"uses","to":"wallet","note":"payments to review and money owed"},{"type":"constrains","to":"design-system","note":"admin surfaces use the same glass tokens"}],"summary":"The admin's workspace: a glass sidebar of seven short sections (Orders,\nMoney, Menu, Stock, Insights, Settings, plus the dashboard). It shows live\nbadges for orders to confirm, orders ready to dispatch and payments to\nreview, and becomes a drawer on phones. A slim top bar holds language, theme,\npalette, notifications and the account. The dashboard answers \"what needs me\nnow?\": counts per order step, money owed and to review, and a list of orders\nwith the action each one waits for. The order page leads with one\n\"next step\" card.","rules":[{"id":"R-ADM-001","meta":{"tokens":["must"]},"text":"Admin navigation lives in the sidebar sections, not the shared header. A new admin page gets a sidebar entry in the right section, not a new top-level group.","more":[]},{"id":"R-ADM-002","meta":{"tokens":["must"]},"text":"Badges and dashboard counts come from `GET /api/admin/overview` (one query set), polled. Pages don't invent their own counts.","more":[]},{"id":"R-ADM-003","meta":{"tokens":["should"]},"text":"An order page always shows the single next action for its step (confirm, then dispatch, then deliver), with cancel only while allowed.","more":[]},{"id":"R-ADM-004","meta":{"tokens":["must"]},"text":"The language switch stays visible in the admin top bar at every width (R-I18N-001).","more":[]}],"decisions":[{"id":"D-ADM-001","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Restructure the admin: replace the crowded header menu with a sectioned sidebar and a task-first dashboard. Requested by the owner (\"the menu is horrible for admin as many menu items there\").","more":["Why: 18 screens didn't fit a header; the owner needs to see what to do next."]},{"id":"D-ADM-002","meta":{"tokens":["proposed"],"date":"2026-10-21"},"text":"Group the admin screens as Orders (all, new, deliveries), Money (wallets & payments, reports & profit, expenses), Menu (products, categories, coupons & promos), Stock (materials, purchases, costing), Insights (analytics) and Settings (ordering & wallet, business profile, users).","more":["Why: matches how the owner thinks about the business, from day-to-day work down to setup."]}],"questions":[],"ideas":[{"id":"I-ADM-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Add a command palette (Ctrl+K) to jump to any order number, customer or screen.","more":[]},{"id":"I-ADM-002","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Add a \"today\" kitchen-and-delivery timeline on the dashboard (orders by slot with their step) so the owner can plan the day's dispatches.","more":[]}]},{"file":"vault/nodes/admin-orders.md","id":"admin-orders","title":"Orders on a customer's behalf","prefix":"ADO","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["client/src/pages/admin/NewOrderAdmin.tsx","server/src/modules/customers/customer-account.service.ts","server/src/modules/orders/admin-order.service.ts"],"relations":[{"type":"extends","to":"orders","note":"admin-created orders follow the same lifecycle"},{"type":"depends-on","to":"auth","note":"creates or reuses placeholder customer accounts by email"},{"type":"constrains","to":"ordering-window","note":"admin orders ignore the cutoff and slot limits"}],"summary":"An admin can place an order for a customer, identified by email, for example\none who ordered by phone or Facebook. If no account exists, a placeholder\ncustomer is created, which the real owner can claim later. The order records\nwhich admin placed it.","rules":[{"id":"R-ADO-001","meta":{"tokens":["must"]},"text":"Admin orders record `placedById`, the admin's footprint.","more":[]},{"id":"R-ADO-002","meta":{"tokens":["must"]},"text":"Admin orders have no cutoff and no slot restriction. Only past dates are rejected.","more":[]},{"id":"R-ADO-003","meta":{"tokens":["must"]},"text":"The customer's notification waits in their inbox, and a placeholder account sees it once claimed.","more":[]}],"decisions":[{"id":"D-ADO-001","meta":{"tokens":["confirmed"],"date":"2026-09-25"},"text":"Let admins order on a customer's behalf by email, using placeholder accounts (commit 56842a9).","more":["Why: many orders still arrive by phone or social media and must be in the system for kitchen, delivery and reports."]},{"id":"D-ADO-002","meta":{"tokens":["confirmed"],"date":"2026-09-26"},"text":"Remove delivery-time limits on admin orders, including the old \"ignore cutoff\" checkbox (commit 8fa3caa).","more":["Why: the owner knows the kitchen's real capacity, so the limits only got in the way."]}],"questions":[],"ideas":[{"id":"I-ADO-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Let an admin search customers by phone as well as by email when starting an order, since phone is what callers give.","more":[]}]},{"file":"vault/nodes/analytics.md","id":"analytics","title":"Analytics","prefix":"ANL","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/analytics/**","client/src/pages/admin/AnalyticsAdmin.tsx"],"relations":[{"type":"uses","to":"catalog","note":"product demand × profit classification"}],"summary":"Customer analytics per period: orders, total spent, average order value,\nquantity, discounts received, last order, favourite products and approximate\nprofit contribution. Products are placed in four quadrants by median units\nsold × median gross profit: **Best** (push), **Optimize** (popular, low\nprofit), **Marketing opportunity** (low demand, high profit) and **Review**\n(low on both). Sales by day completes the picture.","rules":[{"id":"R-ANL-001","meta":{"tokens":["must"]},"text":"Guest orders are grouped under one \"Guest\" bucket in customer analytics.","more":[]},{"id":"R-ANL-002","meta":{"tokens":["should"]},"text":"Quadrant thresholds are medians of the period, not fixed numbers.","more":[]}],"decisions":[{"id":"D-ANL-001","meta":{"tokens":["confirmed"],"date":"2026-09-12"},"text":"Classify products by demand × profit quadrants (Phase 10).","more":["Why: tells the owner what to promote, reprice or drop."]}],"questions":[],"ideas":[{"id":"I-ANL-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"A \"customers to win back\" list: customers whose usual ordering gap has passed, with one-tap coupon creation for them.","more":[]}]},{"file":"vault/nodes/auth.md","id":"auth","title":"Accounts & sign-in (Google only)","prefix":"AUTH","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/auth/**","server/src/lib/googleAuth.ts","server/src/utils/jwt.ts","server/src/utils/password.ts","server/src/middleware/rateLimit.ts","server/src/lib/rateLimit.ts","server/prisma/seed.ts","client/src/context/AuthContext.tsx","client/src/pages/Login.tsx","client/src/pages/Profile.tsx","client/src/pages/Auth.css","client/src/components/GoogleSignInButton.tsx","client/src/components/PhoneNoticeBanner.tsx"],"relations":[{"type":"uses","to":"email","note":"the \"your account is ready, sign in with Google\" mail for admin-created accounts"},{"type":"triggers","to":"scheduled-jobs","note":"legacy never-confirmed self-registered accounts are cleaned up"},{"type":"extends","to":"access-control","note":"issues the JWT that carries the role"}],"summary":"Everyone (customers, admin and kitchen) signs in with **Google only**. The\nfirst Google sign-in creates a customer account. A Google sign-in for an\nemail that already has an account (a seeded or admin-created staff member, an\nolder password account, or a placeholder an admin ordered for) logs into that\naccount. There are no passwords, email codes or password resets. A missing\nphone number is asked for at checkout. Sessions are JWT bearer tokens, and\nguests can still order without any account.","rules":[{"id":"R-AUTH-001","meta":{"tokens":["must"]},"text":"Sign-in is Google only, for every role. There are no register, password-login, email-code or password-reset endpoints or pages. Re-adding any of them needs the owner's decision.","more":[]},{"id":"R-AUTH-002","meta":{"tokens":["must"]},"text":"A placeholder account is never deleted. A Google sign-in for its email takes it over with all its orders, and clears `isPlaceholder`.","more":[]},{"id":"R-AUTH-003","meta":{"tokens":["must"]},"text":"A Google sign-in for an existing email logs into that account without changing its role, and confirms it (`emailVerifiedAt`) if it was unconfirmed. A new email creates a confirmed CUSTOMER immediately and claims guest orders placed with that email.","more":[]},{"id":"R-AUTH-004","meta":{"tokens":["must"]},"text":"`POST /api/auth/google` is throttled per IP (30 per 5 minutes), fail-open. Google accounts whose email Google hasn't verified are refused.","more":[]},{"id":"R-AUTH-005","meta":{"tokens":["must"]},"text":"The cleanup job deletes only legacy *self-registered* accounts that never confirmed (`createdById` null). It never deletes admin-created accounts, which stay unconfirmed until their owner's first Google sign-in, and never deletes placeholders.","more":[]},{"id":"R-AUTH-006","meta":{"tokens":["should"]},"text":"Phone number is optional on the account but is collected before delivery: a storefront banner and a checkout field prompt for a missing number.","more":[]},{"id":"R-AUTH-007","meta":{"tokens":["must"]},"text":"Sign-in requires `GOOGLE_CLIENT_ID` (server) and `VITE_GOOGLE_CLIENT_ID` (client), set to the same OAuth client. Without them the sign-in page explains it isn't set up, and guest checkout keeps working.","more":[]}],"decisions":[{"id":"D-AUTH-001","meta":{"tokens":["superseded"],"date":"2026-09-15","by":"D-AUTH-004"},"text":"Switch account confirmation from SMS to email.","more":["Why: SMS cost and delivery problems."]},{"id":"D-AUTH-002","meta":{"tokens":["confirmed"],"date":"2026-09-16"},"text":"Add Google Sign-In.","more":["Why: one-tap sign-up removes the email-code round trip, which is the biggest drop-off point."]},{"id":"D-AUTH-003","meta":{"tokens":["superseded"],"date":"2026-09-15","by":"D-AUTH-004"},"text":"Delete never-confirmed accounts after a time window.","more":["Why: they have no proven owner and would otherwise block real owners."]},{"id":"D-AUTH-004","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"**Google-only sign-in** for customers and staff, chosen by the owner to keep the site simple:","more":["Staff: admin and kitchen sign in with Google too. Seeded staff come from `SEED_ADMIN_EMAIL` and `SEED_KITCHEN_EMAIL`, and admins add more staff by their Google email.","Old accounts: a password account reaches its data by signing in with Google on the same email. Accounts on a non-Google email can no longer sign in.","Backend: the register, password-login, verify-email, resend-email, forgot-password and reset-password endpoints and pages were removed. The old links redirect to `/login`.","Guests: guest checkout stays. The phone number is asked for at checkout when missing.","Rules changed: R-AUTH-001 to R-AUTH-005 were rewritten for Google-only, and R-AUTH-007 was added. R-USR-002 and R-ACL-002 were updated, and D-USR-002 was added. The cleanup job is now limited to legacy self-registered rows, because admin-created accounts now stay unconfirmed until the first Google sign-in.","Why: one login method, no passwords to forget or reset, no confirmation emails, and fewer screens and endpoints. Google proves the email, so accounts are verified by construction."]}],"questions":[{"id":"Q-AUTH-001","meta":{"tokens":["answered","→","D-AUTH-004"],"date":"2026-10-21"},"text":"The `User` model comment in `schema.prisma` said \"Phone confirmation is mandatory; email optional\". It was corrected for Google-only sign-in.","more":[]}],"ideas":[{"id":"I-AUTH-001","meta":{"tokens":["rejected"],"date":"2026-10-21","impact":"high","effort":"M"},"text":"Passwordless \"email me a sign-in code\" login.","more":["Rejected: the owner chose Google-only sign-in (D-AUTH-004)."]},{"id":"I-AUTH-002","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Clean up the legacy schema with a migration: drop the unused `VerificationCode` table and the `VerificationChannel` enum, and make `User.passwordHash` and `phoneVerifiedAt` nullable (or drop them). Nothing reads them since D-AUTH-004.","more":[]},{"id":"I-AUTH-003","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Show Google One Tap (the small \"Continue as …\" prompt) on the cart page for signed-out visitors with items in the cart. Signing in there pre-fills checkout and unlocks tracking, with no extra page.","more":[]}]},{"file":"vault/nodes/bkash.md","id":"bkash","title":"bKash online payment","prefix":"BKS","kind":"integration","status":"deprecated","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/payments/payment-setting.service.ts"],"relations":[{"type":"feeds","to":"payments","note":"a successful execute records a SUCCESS payment"}],"summary":"Online bKash checkout (Tokenized Checkout) was removed on 2026-10-21: there\nis no merchant account, so customers send money to the business's bKash\nnumber manually and claim it with the TrxID (wallet node). Only the bKash\n*account number* remains, in the payment-account settings.","rules":[{"id":"R-BKS-001","meta":{"tokens":["must"]},"text":"No online bKash flow until the owner has a merchant account and decides to add it back. If it returns, it must record payments as wallet entries, idempotently.","more":[]}],"decisions":[{"id":"D-BKS-001","meta":{"tokens":["confirmed"],"date":"2026-09-16"},"text":"Show bKash online payment as \"coming soon\" in the UI until a merchant account is live.","more":["Why: no live merchant credentials yet."]},{"id":"D-BKS-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"No bKash merchant account exists yet. The online-payment button stays \"coming soon\", and customers pay in advance manually (verified claims) or by cash on delivery. Revisit when the owner opens a merchant account.","more":["Why: owner confirmed there is no merchant account yet."]},{"id":"D-BKS-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Remove the online bKash checkout code, routes, env vars and \"coming soon\" button. Direct bKash payment is not available, so customers pay manually and claim. This rewrote R-BKS-001 and retired the old pending-row rule.","more":["Why: owner: \"Direct bkash payment is not available\"."]}],"questions":[{"id":"Q-BKS-001","meta":{"tokens":["answered","→","D-BKS-002"],"date":"2026-10-21"},"text":"When will the bKash merchant account be live? Turning the button on is an env-var plus UI-flag change.","more":[]}],"ideas":[{"id":"I-BKS-001","meta":{"tokens":["new"],"impact":"high","effort":"M"},"text":"When a merchant account exists, add bKash Tokenized Checkout back as an instant pay-first option that writes wallet entries, removing the manual review queue.","more":[]}]},{"file":"vault/nodes/business-profile.md","id":"business-profile","title":"Business identity & profile","prefix":"BIZ","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/business/**","server/src/modules/payments/payment-setting.service.ts","client/src/config/businessProfile.ts","client/src/context/BusinessProfileContext.tsx","client/src/lib/businessProfile.ts","client/src/pages/BusinessProfileSettings.tsx","client/src/pages/Contact.tsx","client/src/components/Logo.tsx","client/src/components/DocumentHeader.tsx"],"relations":[{"type":"configures","to":"storefront","note":"name, tagline, logo and contact on every page"},{"type":"configures","to":"payments","note":"the manual-payment account numbers shown to customers"},{"type":"configures","to":"email","note":"branding in transactional mail"}],"summary":"The business identity: Bangla and English name, tagline (moto), logo,\ncontact, address, partners with ownership percentages, and defaults (BDT,\nBangla, order-id prefix `CB`, Asia/Dhaka). It is stored as a JSON blob in a\nsingleton row, so every client shares it, and admins edit it in Business\nProfile. The public `/contact` page is built from it.","rules":[{"id":"R-BIZ-001","meta":{"tokens":["must"]},"text":"Business identity is never hard-coded in components. Read it from `useBusinessProfile()`, whose defaults live in `config/businessProfile.ts`.","more":[]},{"id":"R-BIZ-002","meta":{"tokens":["must"]},"text":"Currency is BDT and the business timezone is Asia/Dhaka (a fixed UTC+6 offset with no DST). Date logic relies on this.","more":[]},{"id":"R-BIZ-003","meta":{"tokens":["should"]},"text":"The brand name is ছায়া বাড়ি / Chaya Bari, and the tagline is \"আস্থার ছায়ায় ঘেরা, গুণ ও মানের বসত বাড়ি / A home of trust, quality and care\".","more":[]}],"decisions":[{"id":"D-BIZ-001","meta":{"tokens":["confirmed"],"date":"2026-09-13"},"text":"Store the profile in a singleton DB row (a JSON blob), editable by admins.","more":["Why: identity changes, such as a new phone number or logo, should never need a deploy."]}],"questions":[],"ideas":[{"id":"I-BIZ-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Add opening hours and a \"kitchen closed today\" switch to the profile, shown on the home page and checkout, so customers aren't surprised on holidays.","more":[]}]},{"file":"vault/nodes/cart.md","id":"cart","title":"Cart","prefix":"CART","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["client/src/context/CartContext.tsx","client/src/pages/Cart.tsx","client/src/pages/Cart.css"],"relations":[{"type":"depends-on","to":"catalog","note":"items reference products and their current price"},{"type":"feeds","to":"checkout","note":"the cart's lines become the order request"}],"summary":"A client-side cart, kept in localStorage, with quantity controls and a count\nbadge in the header. It works for guests and customers alike.","rules":[{"id":"R-CART-001","meta":{"tokens":["must"]},"text":"Prices shown in the cart are a preview. The server re-prices every line at checkout from current product data.","more":[]},{"id":"R-CART-002","meta":{"tokens":["should"]},"text":"Unavailable products cannot be added. When a carted product becomes unavailable, checkout refuses it with a clear message.","more":[]}],"decisions":[{"id":"D-CART-001","meta":{"tokens":["confirmed"],"date":"2026-09-11"},"text":"Keep the cart in localStorage (Phase 3), with no server-side cart.","more":["Why: it is simple, works for guests, and needs no extra tables."]}],"questions":[],"ideas":[{"id":"I-CART-001","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Animate the header cart count when an item is added (design.md §14), and confirm the add with a toast that offers Undo.","more":[]}]},{"file":"vault/nodes/catalog.md","id":"catalog","title":"Product catalog","prefix":"CAT","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/products/**","client/src/lib/products.ts","client/src/types/product.ts","client/src/pages/admin/ProductsAdmin.tsx","client/src/pages/admin/ProductForm.tsx","client/src/pages/admin/CategoriesAdmin.tsx","client/public/products/**"],"relations":[{"type":"feeds","to":"pricing-discounts","note":"list price and optional sale price per product"},{"type":"feeds","to":"kitchen","note":"what to make is grouped by product"},{"type":"feeds","to":"inventory-costing","note":"each product can have a recipe"}],"summary":"Products and categories, with Bangla names and optional English twins,\ndescription, image URL, price, optional sale price and preparation info.\n`isActive` controls whether a product is in the catalog at all, and\n`isAvailable` controls whether it can be ordered today (sold out). Every price\nchange is appended to `ProductPriceHistory`.","rules":[{"id":"R-CAT-001","meta":{"tokens":["must"]},"text":"A price change appends a `ProductPriceHistory` row. Past orders keep their captured prices and are never re-priced.","more":[]},{"id":"R-CAT-002","meta":{"tokens":["must"]},"text":"A sale price applies only when it is below the list price. The reduction is recorded as a food discount on each order line.","more":[]},{"id":"R-CAT-003","meta":{"tokens":["must"]},"text":"`isActive = false` hides a product everywhere public. `isAvailable = false` keeps it visible but not orderable.","more":[]},{"id":"R-CAT-004","meta":{"tokens":["should"]},"text":"Product images are URLs (root-relative `/products/...` or absolute). There are no uploads yet.","more":[]}],"decisions":[{"id":"D-CAT-001","meta":{"tokens":["confirmed"],"date":"2026-09-15"},"text":"Add bilingual product names (`nameEnglish`), following the moto's pattern.","more":["Why: English-language customers saw only Bangla names."]}],"questions":[],"ideas":[{"id":"I-CAT-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Add a daily stock limit per product (\"only 12 left for tomorrow\"). Homemade capacity is finite, and today sold-out is a manual all-or-nothing switch.","more":[]},{"id":"I-CAT-002","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Allergen and dietary tags (contains nuts, dairy, spicy level) on product cards and filters.","more":[]}]},{"file":"vault/nodes/checkout.md","id":"checkout","title":"Checkout","prefix":"CHK","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["client/src/pages/Checkout.tsx","client/src/pages/Checkout.css","client/src/pages/OrderConfirmation.tsx","server/src/modules/orders/order.service.ts","server/src/modules/orders/order.schemas.ts"],"relations":[{"type":"depends-on","to":"cart","note":"the order is built from cart lines"},{"type":"depends-on","to":"ordering-window","note":"date and time slot must be inside the allowed window"},{"type":"depends-on","to":"delivery-coverage","note":"address area must be serviceable"},{"type":"depends-on","to":"pricing-discounts","note":"server prices the order authoritatively"},{"type":"uses","to":"wallet","note":"pay later needs headroom; wallet credit pays pay-first orders"},{"type":"uses","to":"addresses","note":"pick a saved address or enter one"},{"type":"triggers","to":"orders","note":"placing creates a PENDING order"},{"type":"triggers","to":"notifications","note":"customer and admins are notified of a new order"}],"summary":"The customer picks or enters an address, a fulfillment date (bounded by the\ncutoff), a two-hour time slot and a payment method (pay first, pay later or\ncash on delivery, from a 3-way picker that shows the pay-later headroom),\napplies a coupon, adds notes, and places the order. Guests check\nout without an account (see guest-checkout). Admin and kitchen accounts\ncannot place orders here.","rules":[{"id":"R-CHK-001","meta":{"tokens":["must"]},"text":"The server validates the date, slot, area and every price, and is authoritative. Client totals are previews.","more":[]},{"id":"R-CHK-002","meta":{"tokens":["must"]},"text":"Each order line captures the product name, list price, charged unit price and line total at order time.","more":[]},{"id":"R-CHK-003","meta":{"tokens":["must"]},"text":"The address is snapshotted onto the order. Editing or deleting the saved address never changes past orders.","more":[]},{"id":"R-CHK-004","meta":{"tokens":["must"]},"text":"A missing phone number is captured at checkout and saved back to the profile and address.","more":[]},{"id":"R-CHK-005","meta":{"tokens":["should"]},"text":"Delivery dates are shown with their weekday.","more":[]},{"id":"R-CHK-006","meta":{"tokens":["must"]},"text":"Pay later is offered only to signed-in customers and only when the order fits their available limit. The server re-checks (R-WAL-004).","more":[]}],"decisions":[{"id":"D-CHK-001","meta":{"tokens":["confirmed"],"date":"2026-09-19"},"text":"Customers can change the payment method until the order is confirmed (commit 4955faf).","more":["Why: customers often switch from transfer to COD (or back) after placing."]},{"id":"D-CHK-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Offer three payment methods at checkout: pay first, pay later and cash on delivery (D-WAL-001).","more":["Why: owner's request."]}],"questions":[],"ideas":[{"id":"I-CHK-001","meta":{"tokens":["new"],"impact":"high","effort":"M"},"text":"Collapse checkout into a single-screen, three-step stepper (Address → When → Pay) with a sticky summary on mobile. Today it is one long form, and a progress cue reduces abandonment.","more":[]},{"id":"I-CHK-002","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Remember the last-used time slot and payment mode for returning customers and preselect them.","more":[]}]},{"file":"vault/nodes/delivery-coverage.md","id":"delivery-coverage","title":"Delivery coverage areas","prefix":"COV","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/orders/delivery-areas.ts","client/src/lib/deliveryAreas.ts","client/src/components/CoverageBanner.tsx","client/src/components/CoverageBanner.css"],"relations":[{"type":"constrains","to":"checkout","note":"out-of-coverage addresses are blocked"},{"type":"constrains","to":"addresses","note":"the area is picked from a zone-grouped selector"},{"type":"extends","to":"orbitax-billing","note":"Orbitax accounts may also order to their Mohakhali office"}],"summary":"Orders are accepted only for serviceable areas, grouped into zones: Mirpur\n12/DOHS, ECB Chattar/Matikata, Manikdi/Balughat and Baunia. The city is\nlocked to Dhaka. A closeable promo banner advertises the coverage, and the\ncontact page lists every zone.","rules":[{"id":"R-COV-001","meta":{"tokens":["must"]},"text":"The server refuses any order whose area is outside coverage. The client warns early, but the server decides.","more":[]},{"id":"R-COV-002","meta":{"tokens":["must"]},"text":"`server/src/modules/orders/delivery-areas.ts` is the single source of truth, and `client/src/lib/deliveryAreas.ts` mirrors it. Change both together.","more":[]},{"id":"R-COV-003","meta":{"tokens":["must"]},"text":"Orbitax (`orbitax.com`) accounts may also order to the Mohakhali office area.","more":[]}],"decisions":[{"id":"D-COV-001","meta":{"tokens":["confirmed"],"date":"2026-09-20"},"text":"Restrict ordering to serviceable delivery areas, with the city locked to Dhaka.","more":["Why: deliveries outside these zones cost more than the delivery charge covers."]}],"questions":[],"ideas":[{"id":"I-COV-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"When an address is out of coverage, offer \"Notify me when you deliver to \u003carea>\" and store the area. Those requests become demand data for choosing the next zone.","more":[]},{"id":"I-COV-002","meta":{"tokens":["new"],"impact":"low","effort":"M"},"text":"Move coverage zones to the database, editable by admins, which removes the client/server mirror (R-COV-002).","more":[]}]},{"file":"vault/nodes/delivery.md","id":"delivery","title":"Delivery","prefix":"DLV","kind":"feature","status":"partial","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/delivery/**","client/src/pages/admin/DeliveriesAdmin.tsx","client/src/pages/admin/DeliverySection.tsx","client/src/lib/delivery.ts","client/src/types/delivery.ts"],"relations":[{"type":"depends-on","to":"orders","note":"one delivery record per order"},{"type":"feeds","to":"profit-reports","note":"delivery gain or loss per order"}],"summary":"A third party (or a rider) delivers. Each order can have one delivery record\nwith who delivers it (provider or rider), a tracking reference or phone, and\nexactly two cost values: what the customer was charged, and what the business\nactually paid. Progress is the order's own status (On the way, then\nDelivered). Dispatching from the order page records who delivers it.","rules":[{"id":"R-DLV-001","meta":{"tokens":["must"]},"text":"There are exactly two cost values: `customerDeliveryCost` (net of any delivery discount) and `actualDeliveryCost` (entered later). There is deliberately no estimated delivery cost.","more":[]},{"id":"R-DLV-002","meta":{"tokens":["must"]},"text":"The difference (customer − actual) is derived and never stored. It is null until the actual cost is entered.","more":[]},{"id":"R-DLV-003","meta":{"tokens":["must"]},"text":"Customers see delivery status, provider and tracking, never any cost detail.","more":[]},{"id":"R-DLV-004","meta":{"tokens":["should"]},"text":"A future provider integration (Pathao, pandago) hooks into the dispatch step, filling provider and tracking, without adding a second status machine.","more":[]},{"id":"R-DLV-005","meta":{"tokens":["must"]},"text":"The delivery record has no status of its own. Where an order is comes only from `Order.status`.","more":[]}],"decisions":[{"id":"D-DLV-001","meta":{"tokens":["confirmed"],"date":"2026-09-12"},"text":"Use two delivery costs and no estimate (Phase 6 business rule).","more":["Why: estimates were never accurate. Only what was charged and what was paid matter for profit."]},{"id":"D-DLV-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Remove the delivery record's own status machine and the mock \"dispatch to provider\". The order status is the one truth, and dispatch is the order's \"On the way\" step (part of D-ORD-003). This rewrote R-DLV-004 and added R-DLV-005.","more":["Why: two unsynced state machines for the same journey."]}],"questions":[],"ideas":[{"id":"I-DLV-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Warn the admin on the dashboard about delivered orders still missing an actual delivery cost, since they make contribution reports incomplete.","more":[]}]},{"file":"vault/nodes/design-system.md","id":"design-system","title":"Design system (Glossy Glass)","prefix":"DSN","kind":"cross-cutting","status":"live","scope":"global","reviewed":"2026-10-21","code":["design.md","client/index.html","client/scripts/palettes.mjs","client/scripts/check-colors.mjs","client/src/styles/**","client/src/index.css","client/src/fonts.css","client/src/lib/appearance.ts","client/src/lib/motion.ts","client/src/lib/palettes.gen.ts","client/src/context/ThemeContext.tsx","client/src/components/Backdrop.tsx","client/src/components/Segmented.tsx","client/src/components/ThemeSwitch.tsx","client/src/components/PalettePicker.tsx","client/src/components/PalettePicker.css","client/src/components/PrefControls.tsx","client/src/components/PrefControls.css","client/src/components/Logo.tsx","client/public/fonts/**"],"relations":[{"type":"constrains","to":"storefront","note":"every customer surface uses glass tokens and components"},{"type":"constrains","to":"kitchen","note":"kitchen board statuses use semantic colours with icons"},{"type":"constrains","to":"orders","note":"order and payment status pills are semantic, never palette-tinted"},{"type":"depends-on","to":"i18n","note":"Bangla typography rules and bilingual palette names"}],"summary":"The visual language: glossy glass surfaces over a drifting aurora, seven\ncontrast-verified palettes (Ember & Gold by default) in light, dark and system\nmodes, and calm, transform-only motion. `/design.md` is the full\nspecification. This node holds its rules and the decisions behind them.","rules":[{"id":"R-DSN-001","meta":{"tokens":["must"]},"text":"No component hard-codes a colour. Colours come from `styles/tokens.css` or the generated `styles/palettes.css`, and `npm run check:design` must pass.","more":[]},{"id":"R-DSN-002","meta":{"tokens":["must"]},"text":"Palettes are changed only in `client/scripts/palettes.mjs`, then regenerated with `npm run palettes`. Never edit `palettes.css` or `palettes.gen.ts` by hand.","more":[]},{"id":"R-DSN-003","meta":{"tokens":["must"]},"text":"Every palette in both modes passes the contrast minimums: body text ≥14:1, accent-ink ≥5.6 (light) / ≥7.8 (dark), h-grad stops ≥4.6, on-accent on btn-grad ≥4.8, focus accent ≥3.5.","more":[]},{"id":"R-DSN-004","meta":{"tokens":["must"]},"text":"Text never sits on `--grad`. Gradient text uses `--h-grad` on the text element itself. Text on `--btn-grad` uses `--on-accent`.","more":[]},{"id":"R-DSN-005","meta":{"tokens":["must"]},"text":"Status colours (success, warning, danger, info) mean status only, never change with the palette, and always come with an icon and a text label.","more":[]},{"id":"R-DSN-006","meta":{"tokens":["must"]},"text":"Bangla text is never letter-spaced. Bangla body text is 17px / 1.78.","more":[]},{"id":"R-DSN-007","meta":{"tokens":["must"]},"text":"Theme, palette and language are applied before first paint by the inline script in `client/index.html`, using the `chaya-theme`, `chaya-palette` (a palette id or `random`), `chaya-palette-random` (the current random pick and its expiry) and `chaya-lang` keys. Changing a key means changing both places. The script's palette-id list is injected by `npm run palettes`.","more":[]},{"id":"R-DSN-008","meta":{"tokens":["must"]},"text":"Animate only transform, opacity and clip-path. Honour `prefers-reduced-motion` and `html.low-motion`. Never leave first-paint content at opacity 0.","more":[]},{"id":"R-DSN-009","meta":{"tokens":["must"]},"text":"Glass falls back to `--glass-solid` without backdrop-filter or under low-motion. Popovers and menus use `--popover-bg` so text behind them never bleeds through.","more":[]},{"id":"R-DSN-010","meta":{"tokens":["must"]},"text":"Touch targets are ≥48px, focus rings are visible (2px accent, 2px offset), and there is no horizontal scroll at 360px.","more":[]},{"id":"R-DSN-011","meta":{"tokens":["must"]},"text":"Printed documents (invoice, receipt) are always a clean white sheet, using the `--print-*` tokens.","more":[]},{"id":"R-DSN-012","meta":{"tokens":["should"]},"text":"No new UI dependencies. The design system is plain CSS plus a few KB of TypeScript.","more":[]},{"id":"R-DSN-013","meta":{"tokens":["should"]},"text":"Fonts are self-hosted (Hind Siliguri for body, Anek Bangla for display). No external font CDN.","more":[]},{"id":"R-DSN-014","meta":{"tokens":["must"]},"text":"Random mode never swaps the palette while the tab is hidden, while the user is typing in a field, or while the palette picker is open. Automatic swaps use the soft crossfade (not the circular reveal), are instant under reduced motion, keep the same pick across reloads until its period ends, and stay in sync across open tabs.","more":[]},{"id":"R-DSN-015","meta":{"tokens":["must"]},"text":"Appearance changes (theme, palette, language) take effect even when a View Transition does not run. `withViewTransition` applies the update directly if the browser hasn't run it within 400ms. State must never depend on an animation completing.","more":[]},{"id":"R-DSN-016","meta":{"tokens":["must"]},"text":"Default palette preference for new visitors is **Random**. When the user picks a fixed palette instead, the default fixed palette is **Ember & Gold** (no `data-palette` attribute).","more":[]}],"decisions":[{"id":"D-DSN-001","meta":{"tokens":["superseded"],"date":"2026-09-14","by":"D-DSN-002"},"text":"Retheme to \"Ember\": red, gold and black dark luxury, with dark as the default (commit \"Retheme app to Ember red+gold+black\").","more":["Why: a premium food identity instead of the original greens."]},{"id":"D-DSN-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Adopt the \"Glossy Glass\" system from `glass-redesign-master-prompt.md` across the whole client: tokens, glass surfaces, palettes with light/dark/system, palette picker, motion. Look and feel only; no business logic, routes, API or i18n keys change.","more":["Why: the owner asked for it to be folded into design.md and applied to the overall project."]},{"id":"D-DSN-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Make the brand palette **Ember & Gold** the default fixed palette (no `data-palette`) rather than the brief's Sapphire, and add it as a seventh palette generated to the same contrast rules. Confirmed by the owner. D-DSN-009 then made Random the default preference, with Ember the default whenever Random is not chosen.","more":["Why: the logo, favicon and brand are red and gold, and a blue default would break brand recognition."]},{"id":"D-DSN-004","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"The default theme for new visitors is **System**. Returning visitors keep their stored light or dark choice, since the old provider always stored one.","more":["Why: the brief specifies System. The old dark-by-default came from the Ember theme, which D-DSN-002 replaces."]},{"id":"D-DSN-005","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Keep the self-hosted Hind Siliguri and Anek Bangla fonts instead of loading Plus Jakarta Sans and Inter from Google Fonts as the brief says.","more":["Why: fonts were self-hosted on 2026-09-13 so that Bengali digits such as ১ always render correctly, and this keeps that guarantee with no external dependency."]},{"id":"D-DSN-006","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Drop the brief's health-specific items (BMDC badges, dose units, the 999 emergency message) and rename \"Clinical Teal\" to \"Fresh Mint\". Food-brand trust signals take their place.","more":["Why: the brief was written for a health platform."]},{"id":"D-DSN-007","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Keep the existing `chaya-*` storage keys instead of the brief's `sh-*` keys.","more":["Why: returning visitors keep their language and theme choice."]},{"id":"D-DSN-008","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Map order and kitchen statuses onto the four semantic colours: pending → warning; confirmed through out-for-delivery → info; delivered → success; cancelled → danger. Each also gets an icon, which replaced the old per-status pastel colours.","more":["Why: R-DSN-005, since the old pastels were neither semantic nor contrast-checked in dark mode."]},{"id":"D-DSN-009","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Add a **Random** palette option. Random is the default for new visitors and rotates through all seven palettes at random intervals. The user can switch to any fixed palette, and when Random is not chosen, Ember & Gold is the default. Requested by the owner. This refines D-DSN-003, updates R-DSN-007 (new `chaya-palette-random` key) and adds R-DSN-014 and R-DSN-016.","more":["Why: the owner wants the site to feel fresh and showcase every palette, while keeping the brand palette as the fixed default."]},{"id":"D-DSN-010","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Numerals keep following the language, with no separate Bangla-numeral toggle. Confirmed by the owner.","more":["Why: fewer settings. Bangla readers already see Bengali digits."]},{"id":"D-DSN-011","meta":{"tokens":["superseded"],"date":"2026-10-21"},"text":"Random interval is a uniform random 5–20 minutes (the owner allowed 3–30 and asked for best practice). Swaps pause while the user is busy (checked again every 30s), crossfade gently, never repeat the current palette, persist across reloads and sync across tabs.","more":["Why: under about 5 minutes the change becomes a distraction mid-order (a typical browse-to-checkout takes 3–8 minutes). Over about 20, most sessions would never see a change, which defeats the feature. Pausing while typing or picking avoids a swap under the user's hands."]},{"id":"D-DSN-013","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Random interval is a uniform random 30 seconds to 5 minutes, chosen by the owner. This supersedes D-DSN-011 (5–20 minutes). Everything else about Random is unchanged: pausing while busy, crossfade, no repeats, persistence and tab sync.","more":["Why: the owner wants the palette rotation to be noticeable within a single visit."]},{"id":"D-DSN-012","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Added the 400ms View Transition guard (R-DSN-015) after a test showed that a throttled page could save a palette choice without ever applying it.","more":["Why: the UI and the stored preference disagreed until the next reload."]}],"questions":[{"id":"Q-DSN-001","meta":{"tokens":["answered","→","D-DSN-003"],"date":"2026-10-21"},"text":"Should the default palette be Ember & Gold (the brand, currently implemented) or Sapphire Lagoon (the brief's default)? See D-DSN-003.","more":["Options: (a) Ember default (recommended) · (b) Sapphire default · (c) Ember default but remove the other palettes"]},{"id":"Q-DSN-002","meta":{"tokens":["answered","→","D-DSN-010"],"date":"2026-10-21"},"text":"The brief mentions an optional Bangla-numeral preference (০১২৩ vs 0123). Numerals currently follow the language. Add a separate toggle?","more":["Options: (a) keep following the language (recommended) · (b) add a numerals switch to the palette popover"]}],"ideas":[{"id":"I-DSN-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Use skeleton cards (`.skeleton`) instead of the \"লোড হচ্ছে…\" text on the product list and home page, which makes loading feel faster.","more":[]},{"id":"I-DSN-002","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Add a shared toast system (`.toast` is styled) for \"added to cart\" with Undo, payment-claim submission and saves. Today success feedback is inline text only.","more":[]},{"id":"I-DSN-003","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Add the sticky mobile `.action-bar` to checkout (Place order · ৳total) and product detail (Add to cart).","more":[]},{"id":"I-DSN-004","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Make Random time-aware: favour warm palettes (Ember, Golden Hour, Coral) in the evening ordering window before the 22:00 cutoff, and calmer ones (Sapphire, Fresh Mint) in the morning. This ties the look to the food rhythm of the day.","more":[]},{"id":"I-DSN-005","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Let the owner curate the Random pool from Business Profile (for example exclude palettes that clash with a seasonal campaign) and pin a palette for festivals such as Eid or Pohela Boishakh.","more":[]}]},{"file":"vault/nodes/email.md","id":"email","title":"Transactional email","prefix":"EML","kind":"integration","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/lib/mailer.ts","server/src/lib/emailLogo.ts"],"relations":[{"type":"uses","to":"business-profile","note":"brand name and logo in mail"}],"summary":"Branded HTML plus plain-text email over SMTP. It covers the \"your account is\nready, sign in with Google\" mail for admin-created accounts, order-confirmed\nmail with the tracking link, and review invites. Since D-AUTH-004 there are no\nconfirmation-code or password emails. The templates live in\n`server/src/modules/auth/account-email.service.ts`. Without SMTP credentials the\nmailer runs in log-only mode.","rules":[{"id":"R-EML-001","meta":{"tokens":["must"]},"text":"Every email has a plain-text body. HTML is optional.","more":[]},{"id":"R-EML-002","meta":{"tokens":["must"]},"text":"Non-essential mail (for example review invites) carries a `List-Unsubscribe` header. All mail sets Reply-To.","more":[]},{"id":"R-EML-003","meta":{"tokens":["must"]},"text":"A mail failure never breaks the business action that triggered it.","more":[]},{"id":"R-EML-004","meta":{"tokens":["should"]},"text":"The inline logo is small (as reduced in commit 840fb1d) to keep messages light and out of spam folders.","more":[]}],"decisions":[{"id":"D-EML-001","meta":{"tokens":["confirmed"],"date":"2026-10-06"},"text":"Improve deliverability with a smaller logo, Reply-To and List-Unsubscribe (commit 840fb1d).","more":["Why: mail was landing in spam."]}],"questions":[],"ideas":[{"id":"I-EML-001","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Send a \"your food is on the way\" email at OUT_FOR_DELIVERY for customers without push enabled.","more":[]}]},{"file":"vault/nodes/expenses.md","id":"expenses","title":"Business expenses","prefix":"EXP","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/expenses/**","client/src/pages/admin/ExpensesAdmin.tsx"],"relations":[{"type":"feeds","to":"profit-reports","note":"other expenses reduce net profit"}],"summary":"General business expenses (gas, electricity, marketing…) in dynamic,\nadmin-managed categories, listed by period and summarised by category.","rules":[{"id":"R-EXP-001","meta":{"tokens":["must"]},"text":"Ingredient and packaging purchases are not expenses. They go through inventory (R-INV-002).","more":[]},{"id":"R-EXP-002","meta":{"tokens":["should"]},"text":"Keep it simple: no accounting ledger and no double entry.","more":[]}],"decisions":[{"id":"D-EXP-001","meta":{"tokens":["confirmed"],"date":"2026-09-12"},"text":"Use dynamic expense categories seeded with common ones (Phase 9).","more":["Why: the owner can add categories without code changes."]}],"questions":[],"ideas":[{"id":"I-EXP-001","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Recurring expenses (monthly gas or internet) that pre-fill each month for one-tap confirmation.","more":[]}]},{"file":"vault/nodes/guest-checkout.md","id":"guest-checkout","title":"Guest checkout","prefix":"GST","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/orders/customer.ts","client/src/pages/Checkout.tsx","client/src/pages/OrderConfirmation.tsx"],"relations":[{"type":"extends","to":"checkout","note":"the same flow without an account (POST /api/guest/orders)"},{"type":"feeds","to":"analytics","note":"guest orders are grouped into one \"Guest\" bucket"},{"type":"uses","to":"order-tracking","note":"the tracking link is how a guest follows the order"}],"summary":"Anyone can order without an account. Contact details and address are entered\ninline, plus an optional email. A guest chooses pay-in-advance (the\nconfirmation shows the manual-payment account details and the order number to\nreference) or cash on delivery. Only admins are notified, and the confirmation\ninvites the guest to sign in with Google.","rules":[{"id":"R-GST-001","meta":{"tokens":["must"]},"text":"Guest orders have `customerId = null`. Contact details live in the address snapshot and the optional `guestEmail`.","more":[]},{"id":"R-GST-002","meta":{"tokens":["must"]},"text":"Guest orders are skipped by the review-invite job, because there is no account to review from.","more":[]},{"id":"R-GST-003","meta":{"tokens":["should"]},"text":"Every guest confirmation invites Google sign-in, listing the benefits: tracking, history, faster checkout and reviews. Orders placed with the same email move into the account.","more":[]}],"decisions":[{"id":"D-GST-001","meta":{"tokens":["confirmed"],"date":"2026-09-19"},"text":"Allow guest ordering, with a prepay option and address phone auto-fill.","more":["Why: forcing sign-up before a first order loses first-time customers."]},{"id":"D-GST-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Keep guest checkout alongside Google-only sign-in (D-AUTH-004). Google sign-in stays optional for ordering.","more":["Why: the fastest first order needs no account at all."]},{"id":"D-GST-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Guests can choose pay first or cash on delivery, not pay later (D-WAL-005). After a pay-first guest order, the confirmation shows the payment accounts with copy buttons and the order number as the reference.","more":["Why: a wallet needs an account."]}],"questions":[],"ideas":[{"id":"I-GST-001","meta":{"tokens":["new"],"impact":"high","effort":"M"},"text":"Also attach past guest orders by **phone** number. Same-email guest orders already move into the account on Google sign-in, but many guests type a phone without an email.","more":[]}]},{"file":"vault/nodes/i18n.md","id":"i18n","title":"Bilingual UI (Bangla / English)","prefix":"I18N","kind":"cross-cutting","status":"live","scope":"global","reviewed":"2026-10-21","code":["client/src/context/LanguageContext.tsx","client/src/context/TranslationContext.tsx","client/src/lib/i18n.ts","client/src/lib/format.ts","client/src/lib/notificationText.ts"],"relations":[{"type":"uses","to":"translation","note":"single-language admin content is machine-translated as a fallback"},{"type":"constrains","to":"design-system","note":"Bangla typography rules (no letter-spacing, taller line-height)"}],"summary":"The whole UI is bilingual. Bangla is the default, and an always-visible switch\nin the header changes the language. UI strings are written inline as\n`t('বাংলা', 'English')`. Admin-entered content has optional English twins\n(`nameEnglish` …) and is shown with `tc()` or `lc()`, falling back to\nwhichever language exists.","rules":[{"id":"R-I18N-001","meta":{"tokens":["must"]},"text":"Bangla (`bn`) is the default language. The switch is always visible in the header on every surface: customer, admin and kitchen.","more":[]},{"id":"R-I18N-002","meta":{"tokens":["must"]},"text":"Every user-visible string has both a Bangla and an English variant: `t(bn, en)` in components, and bilingual message keys for notifications and emails.","more":[]},{"id":"R-I18N-003","meta":{"tokens":["must"]},"text":"Admin content with an English twin is rendered with `tc` or `lc`. Show the active language's value when present, otherwise whichever exists. Never show an empty label.","more":[]},{"id":"R-I18N-004","meta":{"tokens":["must"]},"text":"Notifications are stored as a message key plus params (with a Bangla fallback) so the bell renders in the reader's current language, not the language that was active when the notification was created.","more":[]},{"id":"R-I18N-005","meta":{"tokens":["should"]},"text":"Numbers and money shown in Bangla use Bengali digits (`toBnDigits`, `formatBdt`).","more":[]},{"id":"R-I18N-006","meta":{"tokens":["must"]},"text":"The language choice persists in localStorage and is mirrored into the i18n module during the same render, so plain helpers never lag one render behind.","more":[]}],"decisions":[{"id":"D-I18N-001","meta":{"tokens":["confirmed"],"date":"2026-09-19"},"text":"Localize notifications to follow the language toggle (commit 7abde6d).","more":["Why: a Bangla notification read by an English-preferring user (or the reverse) was confusing. Storing key + params makes the text follow the reader."]}],"questions":[],"ideas":[{"id":"I-I18N-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Detect the browser's language on the very first visit and pre-select English for non-Bangla browsers, while keeping Bangla as the default for everyone else.","more":[]}]},{"file":"vault/nodes/inventory-costing.md","id":"inventory-costing","title":"Inventory & product costing","prefix":"INV","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/inventory/**","client/src/pages/admin/MaterialsAdmin.tsx","client/src/pages/admin/PurchasesAdmin.tsx","client/src/pages/admin/RecipeAdmin.tsx","client/src/pages/admin/CostingAdmin.tsx","client/src/lib/inventory.ts","client/src/types/inventory.ts"],"relations":[{"type":"depends-on","to":"catalog","note":"recipes belong to products"},{"type":"feeds","to":"profit-reports","note":"per-unit product cost"}],"summary":"Materials (ingredients and packaging) have a unit, a stock level and a\nweighted-average unit cost maintained from purchases. A recipe (bill of\nmaterials) per product, with a batch yield, gives cost per unit = Σ(material\naverage cost × qty) ÷ yield. From that follow gross profit per unit and\nmargin. Manual stock adjustments cover spoilage and corrections. Every stock\nmovement is logged.","rules":[{"id":"R-INV-001","meta":{"tokens":["must"]},"text":"Material cost is a weighted average updated on each purchase. No FIFO or LIFO.","more":[]},{"id":"R-INV-002","meta":{"tokens":["must"]},"text":"Purchases of ingredients and packaging update inventory and are never recorded as expenses.","more":[]},{"id":"R-INV-003","meta":{"tokens":["must"]},"text":"Every stock change writes an append-only `InventoryTransaction`.","more":[]},{"id":"R-INV-004","meta":{"tokens":["must"]},"text":"Product cost is derived from the recipe and current average costs, never typed in.","more":[]}],"decisions":[{"id":"D-INV-001","meta":{"tokens":["confirmed"],"date":"2026-09-12"},"text":"Use weighted-average costing (Phase 8).","more":["Why: it is simple, matches how a home kitchen buys in bulk, and is good enough for pricing decisions."]}],"questions":[],"ideas":[{"id":"I-INV-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Deduct recipe materials from stock automatically when an order is packed (`readyAt`), and warn about low stock for tomorrow's confirmed orders, turning \"what to buy\" into a list.","more":[]}]},{"file":"vault/nodes/kitchen.md","id":"kitchen","title":"Kitchen production board","prefix":"KIT","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/kitchen/**","client/src/pages/KitchenHome.tsx","client/src/pages/Kitchen.css","client/src/lib/kitchen.ts","client/src/types/kitchen.ts","client/src/layouts/KitchenLayout.tsx"],"relations":[{"type":"depends-on","to":"orders","note":"only CONFIRMED and PREPARING orders are the kitchen's"},{"type":"triggers","to":"notifications","note":"line progress moves order status, which notifies the customer"},{"type":"uses","to":"ordering-window","note":"the day's orders are sorted by time slot"}],"summary":"For a chosen fulfillment day, the kitchen sees what to make per product\n(quantity and how many orders it spans) and works each order line through\nTO_COOK → PREPARING → READY on large, phone- and tablet-friendly controls.\nCustomer notes for the day are surfaced. Packing is a separate, explicit step.","rules":[{"id":"R-KIT-001","meta":{"tokens":["must"]},"text":"Only confirmed, non-cancelled orders (CONFIRMED, PREPARING) count toward production.","more":[]},{"id":"R-KIT-002","meta":{"tokens":["must"]},"text":"Progress is tracked per order line (`OrderItem.kitchenStage`), never per aggregated product, so a new order never inherits another order's progress.","more":[]},{"id":"R-KIT-003","meta":{"tokens":["must"]},"text":"Order status is derived from its lines: all TO_COOK → CONFIRMED, any progress → PREPARING. \"Packed and ready to dispatch\" is an explicit action on an order whose lines are all READY. It sets `Order.readyAt` (no status change) and is cleared automatically if a line is sent back.","more":[]},{"id":"R-KIT-004","meta":{"tokens":["should"]},"text":"Orders are listed by time slot (no slot last), then by creation time.","more":[]},{"id":"R-KIT-005","meta":{"tokens":["should"]},"text":"Controls are large touch targets and readable at arm's length on a tablet.","more":[]}],"decisions":[{"id":"D-KIT-001","meta":{"tokens":["confirmed"],"date":"2026-09-13"},"text":"Track kitchen progress per order line, not per day and product (migrations kitchen_per_order and kitchen_line_stage).","more":["Why: aggregated per-product status leaked between orders."]},{"id":"D-KIT-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"The kitchen keeps its three line stages and the pack step, but orders stay PREPARING until dispatch, with packing recorded as `readyAt` (part of D-ORD-003). This rewrote R-KIT-001 and R-KIT-003.","more":["Why: five customer-facing steps without losing the kitchen's detail."]}],"questions":[],"ideas":[{"id":"I-KIT-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Add a printable or \"big screen\" prep sheet for the day (per-product totals plus per-order packing slips with slot and notes).","more":[]},{"id":"I-KIT-002","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Play a soft chime on the kitchen board when a new order is confirmed for today, using the existing polling.","more":[]}]},{"file":"vault/nodes/knowledge-vault.md","id":"knowledge-vault","title":"Knowledge vault (this graph)","prefix":"KV","kind":"meta","status":"live","scope":"global","reviewed":"2026-10-21","code":["vault/**","CLAUDE.md","AGENTS.md",".claude/settings.json"],"relations":[{"type":"constrains","to":"platform","note":"every change to the project goes through the vault protocol"}],"summary":"The project's long-term memory. Features are nodes, their relations are\nedges, and rules, decisions, open questions and ideas live on the nodes. Every\nAI agent reads it before changing code and writes back what it learned or was\ntold, so the vault gets more complete and consistent as the project grows.","rules":[{"id":"R-KV-001","meta":{"tokens":["must"]},"text":"Before changing code, an agent runs `vault.mjs brief` and `vault.mjs rules \u003cfiles>` for the files it will touch, and reads the affected node files.","more":[]},{"id":"R-KV-002","meta":{"tokens":["must"]},"text":"If a change would break a `[must]` rule, contradict a `confirmed` decision, settle an `open` question, or create a contradiction between rules, the agent stops and asks the user, quoting the ids involved, before acting.","more":[]},{"id":"R-KV-003","meta":{"tokens":["must"]},"text":"Every clarification the user gives is recorded as a `confirmed` decision on the node it concerns, in the same change. A judgement call the user has not seen is recorded as `proposed`.","more":[]},{"id":"R-KV-004","meta":{"tokens":["must"]},"text":"Rules are never deleted or rewritten silently. Every change to a rule comes with a decision that says what changed and why.","more":[]},{"id":"R-KV-005","meta":{"tokens":["must"]},"text":"Entry ids are permanent. Never reuse or renumber them. Get new ones with `vault.mjs next-id`.","more":[]},{"id":"R-KV-006","meta":{"tokens":["must"]},"text":"A new feature gets its own node, with edges to every feature it touches, in the same change that adds the feature.","more":[]},{"id":"R-KV-007","meta":{"tokens":["must"]},"text":"`vault.mjs check` reports 0 errors, and `vault.mjs build` has been run, before work is committed.","more":[]},{"id":"R-KV-008","meta":{"tokens":["should"]},"text":"At the end of each task the agent runs `vault.mjs suggest`, acts on a relevant prompt, and records at least one improvement idea when it noticed one.","more":[]},{"id":"R-KV-009","meta":{"tokens":["should"]},"text":"When an agent re-reads a node's code and confirms the node is accurate, it bumps `reviewed:` to that date.","more":[]}],"decisions":[{"id":"D-KV-001","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Store the vault as Markdown node files with frontmatter edges under `vault/nodes/`, plus a zero-dependency Node CLI.","more":["Why: the user wants a graph of features that both people and AI can read and that grows with the project. Plain Markdown diffs well in PRs, opens in any editor or Obsidian, and needs no database or service."]},{"id":"D-KV-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Load the vault into every Claude Code session automatically. `CLAUDE.md` points to the protocol, and a SessionStart hook in `.claude/settings.json` prints `vault.mjs brief`. `AGENTS.md` does the same for other AI tools.","more":["Why: \"AI will consider the knowledge vault\" has to hold even when the prompt does not mention the vault."]},{"id":"D-KV-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Decisions that were already shipped through merged PRs before the vault existed are recorded as `confirmed`, dated by their commit or migration.","more":["Why: the owner merged them, so they reflect accepted behaviour. Anything the AI inferred without evidence is recorded as `proposed` or as a question instead."]}],"questions":[],"ideas":[{"id":"I-KV-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Add a CI step (GitHub Action) that runs `vault.mjs check` on every PR, so a PR that edits a feature without updating its node is flagged.","more":[]},{"id":"I-KV-003","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Fix the schema drift that existed before the wallet work: the `PaymentMethod` enum's order and the `Order.customerId` foreign-key rule differ between the migrations and `schema.prisma`, which `prisma migrate diff` reports. Add a no-op alignment migration.","more":[]},{"id":"I-KV-002","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Have `vault.mjs stale` comment on PRs that change code under a node's `code` globs without touching that node file.","more":[]}]},{"file":"vault/nodes/notifications.md","id":"notifications","title":"In-app notifications","prefix":"NTF","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/notifications/**","client/src/components/NotificationBell.tsx","client/src/components/NotificationBell.css","client/src/lib/notifications.ts","client/src/lib/notificationText.ts"],"relations":[{"type":"uses","to":"web-push","note":"the same events also go out as OS push"},{"type":"uses","to":"wallet","note":"claim submitted / confirmed / rejected and adjustments"},{"type":"uses","to":"email","note":"some events also send mail (confirmation, review invite)"},{"type":"constrains","to":"i18n","note":"stored as message key + params so text follows the reader's language"}],"summary":"Notifications are generated from real events: order placed (to the customer\nand admins), status changes, wallet claims submitted (to admins), confirmed or\nrejected (to the customer), admin wallet adjustments, and the review invite. A header\nbell shows the unread count, a seven-item panel, mark-all-read and\nclear-all. Clicking a notification opens its in-app link.","rules":[{"id":"R-NTF-001","meta":{"tokens":["must"]},"text":"Notifications come only from real events in services, never from client-side guesses.","more":[]},{"id":"R-NTF-002","meta":{"tokens":["must"]},"text":"Each notification stores a message key + params (plus a Bangla fallback title and body) and an optional in-app link.","more":[]},{"id":"R-NTF-003","meta":{"tokens":["should"]},"text":"Copy is short, specific and actionable: the order number, the amount, and what happens next.","more":[]}],"decisions":[{"id":"D-NTF-001","meta":{"tokens":["confirmed"],"date":"2026-09-20"},"text":"Add a refund notification, and near-live polling updates for the bell and order pages.","more":["Why: customers didn't learn about refunds or status changes until they reloaded."]}],"questions":[],"ideas":[{"id":"I-NTF-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Group notifications by order in the bell (\"CB-1042 · 3 updates\"), so busy days don't push older orders out of the seven-item panel.","more":[]}]},{"file":"vault/nodes/orbitax-billing.md","id":"orbitax-billing","title":"Orbitax corporate billing","prefix":"ORB","kind":"feature","status":"deprecated","scope":"local","reviewed":"2026-10-21","code":["server/src/utils/orbitax.ts","client/src/lib/orbitax.ts"],"relations":[{"type":"extends","to":"wallet","note":"Orbitax staff use the ordinary wallet (with a raised limit)"},{"type":"uses","to":"pricing-discounts","note":"automatic Orbitax coupon"}],"summary":"Orbitax staff (`orbitax.com` emails) keep two perks: ordering to their\nMohakhali office and the automatic delivery coupon. Their separate combined\nbilling page was merged into the wallet on 2026-10-21, and `/orbitax` now\nredirects to `/wallet`.","rules":[{"id":"R-ORB-001","meta":{"tokens":["must"]},"text":"Orbitax perks (office area, auto coupon) are gated by email domain (`orbitax.com` or a subdomain), checked on the server.","more":[]},{"id":"R-ORB-002","meta":{"tokens":["should"]},"text":"Orbitax staff who order on account use pay later. Give them a WALLET_LIMIT promo code (or a series of them) sized to their usual tab.","more":[]}],"decisions":[{"id":"D-ORB-001","meta":{"tokens":["confirmed"],"date":"2026-09-19"},"text":"Add Orbitax combined billing.","more":["Why: office staff order often and prefer settling once a week or month."]},{"id":"D-ORB-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Merge Orbitax combined billing into the wallet and retire the separate page (owner: \"Merge into wallet\"). This rewrote R-ORB-001 and R-ORB-002.","more":["Why: one system to maintain; the wallet already gives a combined balance."]}],"questions":[],"ideas":[{"id":"I-ORB-001","meta":{"tokens":["rejected"],"date":"2026-10-21","impact":"low","effort":"S"},"text":"A monthly Orbitax statement.","more":["Rejected: superseded by the general wallet statement idea (I-WAL-004)."]}]},{"file":"vault/nodes/order-tracking.md","id":"order-tracking","title":"Order tracking","prefix":"TRK","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/orders/tracking.service.ts","client/src/pages/TrackOrder.tsx","client/src/components/OrderTracker.tsx","client/src/components/OrderTracker.css","client/src/lib/orderTracking.ts"],"relations":[{"type":"depends-on","to":"orders","note":"renders order status as a timeline"},{"type":"uses","to":"email","note":"the confirmation email carries the tracking link"},{"type":"uses","to":"wallet","note":"payment shows as the next action (\"pay ৳X\", \"keep ৳X cash ready\"), never as a step"}],"summary":"A 5-step stepper (Placed, Confirmed, Preparing, On the way, Delivered),\nthe same for every payment method, under a \"now\" banner that says in plain\nwords what happens next: pay ৳X, keep ৳X cash ready, packed and leaving soon,\nand so on. Each order can carry a secret tracking token. `/track/\u003ctoken>`\nshows its progress to anyone holding the link, with no login, which serves\nguests and customers of admin-placed orders.","rules":[{"id":"R-TRK-001","meta":{"tokens":["must"]},"text":"The tracking token is 192 random bits, created on first use, and unguessable.","more":[]},{"id":"R-TRK-002","meta":{"tokens":["must"]},"text":"The public tracking page never shows the street address or phone number, in case the link is forwarded.","more":[]},{"id":"R-TRK-003","meta":{"tokens":["must"]},"text":"The \"order confirmed\" email with the link is sent at most once per order, whether an admin confirmed it or full payment did, and a mail failure never blocks confirmation.","more":[]},{"id":"R-TRK-004","meta":{"tokens":["must"]},"text":"The tracker never claims a step that hasn't happened, such as \"Confirmed\" before the order is confirmed. Payment is never a step of its own: it appears as the next action.","more":[]}],"decisions":[{"id":"D-TRK-001","meta":{"tokens":["confirmed"],"date":"2026-09-25"},"text":"Email a tracking link when an order is confirmed, and open tracking links for signed-in staff too.","more":["Why: guests and placeholder customers had no way to follow their order."]},{"id":"D-TRK-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Use the same five steps for every payment method, with the payment action in the banner (part of D-ORD-003).","more":["Why: one mental model for customers."]}],"questions":[],"ideas":[{"id":"I-TRK-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Add \"Add to calendar\" (an .ics file with the delivery slot) on the tracking page and confirmation.","more":[]}]},{"file":"vault/nodes/ordering-window.md","id":"ordering-window","title":"Advance-order window & time slots","prefix":"WIN","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/orders/ordering.service.ts","server/src/modules/orders/slots.ts","client/src/lib/slots.ts","client/src/pages/admin/OrderingSettingsAdmin.tsx"],"relations":[{"type":"constrains","to":"checkout","note":"earliest allowed date and open slots"},{"type":"feeds","to":"kitchen","note":"orders are sorted by time slot on the board"}],"summary":"Food is cooked to order, in advance. An admin sets the cutoff time (default\n22:00), the minimum advance days (default 1), the default delivery charge\n(default ৳60) and the timezone (Asia/Dhaka) in `OrderingSetting`. Two-hour\ntime slots run from 08:00 to 22:00. On weekdays (Sunday–Thursday) only the\n12:00–14:00 slot is open; on Friday and Saturday every slot is open.","rules":[{"id":"R-WIN-001","meta":{"tokens":["must"]},"text":"The server computes the earliest allowed fulfillment date from the cutoff, the minimum advance days and the business timezone, and rejects earlier orders.","more":[]},{"id":"R-WIN-002","meta":{"tokens":["must"]},"text":"The cutoff, minimum advance days and delivery charge come from `OrderingSetting`. Never hard-code them.","more":[]},{"id":"R-WIN-003","meta":{"tokens":["must"]},"text":"Customers on weekdays (Sun–Thu) can only pick 12:00–14:00. On weekends (Fri–Sat) all slots 08:00–22:00 are open. Slots are stored as \"HH:MM-HH:MM\".","more":[]},{"id":"R-WIN-004","meta":{"tokens":["must"]},"text":"Admin orders placed on a customer's behalf ignore the cutoff and slot limits. Only past dates are rejected (see admin-orders).","more":[]},{"id":"R-WIN-005","meta":{"tokens":["must"]},"text":"The slot list is mirrored in `client/src/lib/slots.ts`. Keep it in sync with the server.","more":[]}],"decisions":[{"id":"D-WIN-001","meta":{"tokens":["confirmed"],"date":"2026-09-16"},"text":"Add two-hour delivery slots, with only the noon slot on weekdays.","more":["Why: on workdays the family kitchen can only do a lunch run; weekends have full capacity."]}],"questions":[],"ideas":[{"id":"I-WIN-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Make the weekday and weekend slot sets admin-editable (in `OrderingSetting`), so capacity changes don't need a deploy.","more":[]},{"id":"I-WIN-002","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Per-slot capacity: show a slot as full once N orders are booked into it.","more":[]}]},{"file":"vault/nodes/orders.md","id":"orders","title":"Order lifecycle","prefix":"ORD","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/orders/order.controller.ts","server/src/modules/orders/order.routes.ts","server/src/modules/orders/admin-order.controller.ts","server/src/modules/orders/admin-order.service.ts","client/src/pages/MyOrders.tsx","client/src/pages/OrderDetail.tsx","client/src/pages/Orders.css","client/src/pages/Invoice.tsx","client/src/pages/Document.css","client/src/pages/admin/OrdersAdmin.tsx","client/src/pages/admin/OrderDetailAdmin.tsx","client/src/lib/orders.ts","client/src/lib/orderStatus.ts","client/src/lib/orderEnums.ts","client/src/types/order.ts"],"relations":[{"type":"depends-on","to":"wallet","note":"pay-first orders confirm once paid; charges and refunds go through the wallet"},{"type":"triggers","to":"kitchen","note":"CONFIRMED orders appear on the production board"},{"type":"triggers","to":"delivery","note":"dispatching records who delivers it"},{"type":"triggers","to":"notifications","note":"every status change notifies the customer"},{"type":"triggers","to":"order-tracking","note":"first confirmation emails the tracking link"},{"type":"triggers","to":"reviews","note":"DELIVERED stamps deliveredAt, which drives the review invite"},{"type":"feeds","to":"profit-reports","note":"captured totals are the revenue source"}],"summary":"Five steps everyone sees: Placed (PENDING) → Confirmed → Preparing → On the\nway (OUT_FOR_DELIVERY) → Delivered, with Cancelled as a side exit. \"Packed and\nready to dispatch\" is the kitchen's `readyAt` marker, not a status. Customers\nsee a 5-step tracker with the next action in plain words. Admins work the\norder from one \"next step\" card (confirm, then dispatch, then deliver), with\nmoney and delivery details beside it.","rules":[{"id":"R-ORD-001","meta":{"tokens":["must"]},"text":"Forward-only transitions: PENDING→{CONFIRMED,CANCELLED}, CONFIRMED→{PREPARING,OUT_FOR_DELIVERY,CANCELLED}, PREPARING→OUT_FOR_DELIVERY, OUT_FOR_DELIVERY→DELIVERED. DELIVERED and CANCELLED are terminal. There are exactly these six statuses for every role.","more":[]},{"id":"R-ORD-002","meta":{"tokens":["must"]},"text":"A PAY_FIRST order cannot be confirmed by hand: it confirms itself when its payment settles (R-WAL-006). PAY_LATER and COD orders are confirmed by an admin.","more":[]},{"id":"R-ORD-003","meta":{"tokens":["must"]},"text":"A customer can cancel their own order only while it is PENDING. Any wallet charge is reversed and money already paid stays as wallet credit. After that, the order page points them to `/contact`.","more":[]},{"id":"R-ORD-004","meta":{"tokens":["must"]},"text"
