:"An admin can cancel only from PENDING or CONFIRMED. Cancelling reverses the wallet charge (R-WAL-008).","more":[]},{"id":"R-ORD-005","meta":{"tokens":["must"]},"text":"Once CANCELLED, the order is locked: no status or payment-method changes. Pending claims linked to it are still reviewed, and land as wallet credit.","more":[]},{"id":"R-ORD-006","meta":{"tokens":["must"]},"text":"Order financial fields are captured at checkout and never recomputed from current product prices (historical immutability).","more":[]},{"id":"R-ORD-007","meta":{"tokens":["must"]},"text":"`dispatchedAt` and `deliveredAt` are stamped on the first transition to OUT_FOR_DELIVERY and DELIVERED respectively, and only then.","more":[]},{"id":"R-ORD-009","meta":{"tokens":["must"]},"text":"Order `paymentStatus` is derived by the wallet module (PENDING, PAID, ON_WALLET, PARTIALLY_PAID, REFUNDED). There is no endpoint to set it by hand.","more":[]},{"id":"R-ORD-008","meta":{"tokens":["should"]},"text":"Order numbers use the business prefix (`CB`) and are what customers quote when paying manually.","more":[]}],"decisions":[{"id":"D-ORD-001","meta":{"tokens":["confirmed"],"date":"2026-09-19"},"text":"Add cancellation rules and a contact page (commit 36e1ae7). Block cancelling while a payment awaits verification (commit 5e61b59).","more":["Why: a cancelled order must never strand money, and cancelling after cooking starts wastes food."]},{"id":"D-ORD-002","meta":{"tokens":["confirmed"],"date":"2026-09-15"},"text":"Keep order status in sync with payment for PREPAID orders: auto-confirm when fully paid, and revert to PENDING if a refund or void leaves the order underpaid before cooking starts.","more":["Why: no manual step between \"paid\" and \"kitchen sees it\"."]},{"id":"D-ORD-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Simplify to five statuses everywhere (Placed, Confirmed, Preparing, On the way, Delivered, plus Cancelled), following food-delivery best practice. READY and PACKED merge into PREPARING, with packing kept as `readyAt`. Chosen by the owner (\"5 steps everywhere\"). This rewrote R-ORD-001 and R-ORD-007.","more":["Why: the old 8 statuses plus a separate 6-state delivery machine confused customers and admins alike."]},{"id":"D-ORD-004","meta":{"tokens":["proposed"],"date":"2026-10-21"},"text":"With the wallet, cancelling no longer requires refunding first. The charge is reversed and paid money stays as credit, so customers may cancel a pending order even after paying. This rewrote R-ORD-003, R-ORD-004 and R-ORD-005, and pay-first confirmation is now automatic (R-ORD-002).","more":["Why: the old rule existed so a cancelled order never stranded money; the wallet now holds that money visibly."]},{"id":"D-ORD-005","meta":{"tokens":["proposed"],"date":"2026-10-21"},"text":"Admins may dispatch straight from CONFIRMED (skipping Preparing) when nothing needs cooking, and the manual \"set payment status\" endpoint is removed (R-ORD-009).","more":["Why: real flexibility for ready-made items; a hand-set payment status contradicted the derived one and needed repairing in the migration."]}],"questions":[],"ideas":[{"id":"I-ORD-001","meta":{"tokens":["done"],"date":"2026-10-21","impact":"high","effort":"S"},"text":"On the customer order page, show the next action in plain words (\"Pay ৳450 to confirm\", \"Being cooked, arrives 12–2 pm Friday\") above the tracker, so nobody has to interpret status names.","more":[]},{"id":"I-ORD-002","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Bulk status actions on the admin orders list (for example \"mark all of today's packed orders out for delivery\").","more":[]}]},{"file":"vault/nodes/payments.md","id":"payments","title":"Payment methods & accounts","prefix":"PAY","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/payments/**","client/src/pages/admin/PaymentsSection.tsx","client/src/lib/payments.ts","client/src/lib/paymentLabels.ts"],"relations":[{"type":"configures","to":"wallet","note":"the account numbers and methods customers pay by"},{"type":"configures","to":"checkout","note":"the three payment methods offered"}],"summary":"How customers pay. There are three payment modes per order: pay first, pay\nlater and cash on delivery. Methods are bKash, Nagad, Rocket and bank transfer\n(sent manually, then claimed with the TrxID), plus cash. The business's\naccount numbers are admin-editable (`/payment-info`). Since 2026-10-21 every\nmoney movement is a wallet entry. See the wallet node for the ledger rules.","rules":[{"id":"R-PAY-001","meta":{"tokens":["must"]},"text":"Unconfirmed claims never count toward what is paid (R-WAL-001).","more":[]},{"id":"R-PAY-002","meta":{"tokens":["must"]},"text":"Order payment status, `amountPaid`, `amountDue` and `onWallet` are derived from the order's wallet entries. Never set them by hand.","more":[]},{"id":"R-PAY-003","meta":{"tokens":["must"]},"text":"Money records are never deleted (R-WAL-002). Corrections are new entries with who, when and why.","more":[]},{"id":"R-PAY-004","meta":{"tokens":["must"]},"text":"The three modes are PAY_FIRST, PAY_LATER and COD (guests: PAY_FIRST or COD). The mode can change only while the order is PENDING.","more":[]},{"id":"R-PAY-005","meta":{"tokens":["must"]},"text":"There is no online payment gateway. The customer UI shows the business's accounts and a claim form, never a \"pay online\" button.","more":[]}],"decisions":[{"id":"D-PAY-001","meta":{"tokens":["confirmed"],"date":"2026-09-15"},"text":"Replace payment deletion with an auditable void and refund.","more":["Why: with two partners, every money movement needs a who and a why."]},{"id":"D-PAY-002","meta":{"tokens":["confirmed"],"date":"2026-09-19"},"text":"Add cash on delivery as a payment mode.","more":["Why: many customers won't prepay a new home kitchen."]},{"id":"D-PAY-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Payments became wallet entries, with pay first, pay later and cash on delivery offered at checkout (D-WAL-001). This rewrote R-PAY-001 to R-PAY-005.","more":["Why: one ledger per customer instead of per-order payment rows."]}],"questions":[],"ideas":[{"id":"I-PAY-001","meta":{"tokens":["done"],"date":"2026-10-21","impact":"high","effort":"S"},"text":"When reporting a manual payment, show the exact amount due and a one-tap \"copy\" for the bKash/Nagad number and the order number, so claims match without the admin having to chase.","more":[]},{"id":"I-PAY-002","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Show a QR code for the bKash/Nagad number next to the copy buttons, so customers paying from a second phone can scan instead of typing.","more":[]}]},{"file":"vault/nodes/platform.md","id":"platform","title":"Platform & architecture","prefix":"PLT","kind":"cross-cutting","status":"live","scope":"global","reviewed":"2026-10-21","code":["server/src/app.ts","server/src/index.ts","server/src/routes.ts","server/src/config/**","server/src/lib/**","server/src/middleware/**","server/src/utils/**","server/prisma/schema.prisma","server/prisma/migrations/**","client/src/lib/apiClient.ts","client/src/lib/usePoll.ts","client/src/lib/useInfiniteScroll.ts","client/src/components/Pagination.tsx","client/vite.config.ts","client/vercel.json","server/vercel.json"],"relations":[{"type":"uses","to":"scheduled-jobs","note":"housekeeping runs through the internal cron endpoint"}],"summary":"A modular monolith. The React + Vite + TypeScript client is hosted on Vercel.\nThe Express + TypeScript API runs on Render or Vercel serverless, and Prisma\nconnects it to PostgreSQL (Supabase). Each business capability is a module\nunder `server/src/modules/\u003cname>` with routes, controller, service and zod\nschemas, mounted by `routes.ts`.","rules":[{"id":"R-PLT-001","meta":{"tokens":["must"]},"text":"New backend capability lives in its own module under `server/src/modules/\u003cname>/` (routes → controller → service, with zod schemas) and is mounted in `server/src/routes.ts`.","more":[]},{"id":"R-PLT-002","meta":{"tokens":["must"]},"text":"Routers that serve public endpoints are mounted before any router that mounts at `/` with a blanket `authenticate`. Otherwise the auth gate returns 401 for the public route (see the ordering comments in `routes.ts`).","more":[]},{"id":"R-PLT-003","meta":{"tokens":["must"]},"text":"Schema changes go through a Prisma migration in `server/prisma/migrations/`. Never edit an applied migration.","more":[]},{"id":"R-PLT-004","meta":{"tokens":["must"]},"text":"Money is `Decimal(10,2)` on the server, and every financial figure is computed on the server. The client only previews totals and never sends a price the server trusts.","more":[]},{"id":"R-PLT-005","meta":{"tokens":["must"]},"text":"Admin-only endpoints live under `/api/admin/*` behind `requireRole('ADMIN')`. Kitchen endpoints live under `/api/kitchen` (KITCHEN + ADMIN).","more":[]},{"id":"R-PLT-006","meta":{"tokens":["should"]},"text":"No new heavy dependencies. The client depends only on react, react-dom and react-router-dom, and styling is plain CSS with design tokens.","more":[]},{"id":"R-PLT-007","meta":{"tokens":["should"]},"text":"Near-live data uses `usePoll`, which only fires while the tab is visible and refreshes on focus. There is no websocket backend.","more":[]},{"id":"R-PLT-008","meta":{"tokens":["should"]},"text":"Paginate with infinite scroll on browse feeds (storefront, my orders) and with numbered pages on admin tables.","more":[]},{"id":"R-PLT-009","meta":{"tokens":["must"]},"text":"Secrets and integration credentials (`BKASH_*`, `VAPID_*`, SMTP, `CRON_SECRET`, Google client id) come from env vars. When one is missing, the feature falls back to a mock, log-only or hidden mode rather than crashing.","more":[]}],"decisions":[{"id":"D-PLT-001","meta":{"tokens":["confirmed"],"date":"2026-09-11"},"text":"Build the project as a modular monolith, phase by phase (phases 0–11 in the README).","more":["Why: one small business and one codebase. Modules keep the seams clean, so parts can be split out later if ever needed."]},{"id":"D-PLT-002","meta":{"tokens":["confirmed"],"date":"2026-09-15"},"text":"Store rate limits in the database (the `RateLimit` table) and fail open.","more":["Why: an in-memory limiter is useless on serverless, and blocking real users is worse than letting a few extra requests through."]}],"questions":[],"ideas":[{"id":"I-PLT-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Add a small test suite, starting with the pure functions (pricing, slots, the status transition table, derived payment status). The project has no automated tests today, so regressions in money logic go unnoticed.","more":[]},{"id":"I-PLT-002","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Make the client an installable PWA with an offline banner and cached menu. The service worker already exists for push, and customers on flaky mobile data would get a faster first screen.","more":[]}]},{"file":"vault/nodes/pricing-discounts.md","id":"pricing-discounts","title":"Pricing, discounts & coupons","prefix":"PRC","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/orders/pricing.ts","server/src/modules/coupons/**","client/src/pages/admin/CouponsAdmin.tsx"],"relations":[{"type":"depends-on","to":"catalog","note":"list and sale prices"},{"type":"configures","to":"ordering-window","note":"the default delivery charge is part of the order total"},{"type":"feeds","to":"profit-reports","note":"food and delivery discounts are reported separately"}],"summary":"Order total = (subtotal − food discount) + delivery − delivery discount. Food\ndiscounts come from product sale prices and FOOD-scope coupons. Delivery\ndiscounts come from DELIVERY-scope coupons. Coupons are PERCENT, FIXED or\nFREE_DELIVERY, with an optional minimum net food amount and an expiry.","rules":[{"id":"R-PRC-001","meta":{"tokens":["must"]},"text":"Food discounts and delivery discounts are always kept separate, from the coupon definition through order fields to reports. Never merge them.","more":[]},{"id":"R-PRC-002","meta":{"tokens":["must"]},"text":"Total = (subtotal − productDiscount) + deliveryCost − deliveryDiscount, computed on the server. Coupon discounts are previewed at checkout and recomputed on the server.","more":[]},{"id":"R-PRC-003","meta":{"tokens":["must"]},"text":"A coupon's minimum is checked against the net food amount (after sale prices), not the gross subtotal.","more":[]},{"id":"R-PRC-004","meta":{"tokens":["must"]},"text":"Totals are never negative. A discount is capped at the amount it discounts.","more":[]},{"id":"R-PRC-005","meta":{"tokens":["must"]},"text":"WALLET_LIMIT coupons are not discounts. They can only be redeemed in the wallet (R-WAL-005), and checkout or preview refuses them.","more":[]}],"decisions":[{"id":"D-PRC-001","meta":{"tokens":["confirmed"],"date":"2026-09-11"},"text":"Keep food and delivery discounts separate (Phase 4 business rule).","more":["Why: delivery is a pass-through cost. Mixing the two hides whether promotions eat food margin or delivery margin."]},{"id":"D-PRC-002","meta":{"tokens":["confirmed"],"date":"2026-09-16"},"text":"Orbitax accounts get an automatic coupon.","more":["Why: it is a corporate arrangement with the Orbitax office."]}],"questions":[],"ideas":[{"id":"I-PRC-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Show \"Add ৳X more for free delivery\" in the cart when an active FREE_DELIVERY coupon has a minimum the cart is close to.","more":[]}]},{"file":"vault/nodes/profit-reports.md","id":"profit-reports","title":"Profit & reports","prefix":"RPT","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["client/src/pages/admin/ReportsAdmin.tsx","client/src/pages/admin/ContributionSection.tsx","client/src/pages/AdminDashboard.tsx","client/src/lib/reports.ts","client/src/types/reports.ts"],"relations":[{"type":"feeds","to":"analytics","note":"the same figures underpin customer and product analytics"}],"summary":"Owner-facing money views. Order contribution is net food − product cost +\ncustomer delivery − actual delivery − delivery discount, and is incomplete\nuntil the actual delivery cost is entered. Product profitability per period\nexcludes delivery. The business profit dashboard covers orders, food sales,\ndiscounts, product cost, gross profit, delivery gain or loss, other expenses\nand net profit, plus top products, top customers, low stock, and pending or\nawaiting-delivery counts.","rules":[{"id":"R-RPT-001","meta":{"tokens":["must"]},"text":"Product profitability excludes delivery. Delivery gain or loss is reported on its own.","more":[]},{"id":"R-RPT-002","meta":{"tokens":["must"]},"text":"An order's contribution is marked incomplete while `actualDeliveryCost` is missing.","more":[]},{"id":"R-RPT-003","meta":{"tokens":["must"]},"text":"Cancelled orders are excluded from sales and profit.","more":[]},{"id":"R-RPT-004","meta":{"tokens":["should"]},"text":"The owner sees sales, costs and profit without manual calculation. This is the product's core promise.","more":[]}],"decisions":[{"id":"D-RPT-001","meta":{"tokens":["confirmed"],"date":"2026-09-12"},"text":"Use an order-contribution model plus a period business-profit dashboard (Phase 9).","more":["Why: answers \"did this order make money?\" and \"did this month make money?\"."]}],"questions":[],"ideas":[{"id":"I-RPT-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"A weekly owner digest (email or push): orders, net profit, best seller, and any delivered orders missing delivery cost.","more":[]}]},{"file":"vault/nodes/reorder.md","id":"reorder","title":"Order again","prefix":"REO","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["client/src/components/ReorderButton.tsx","client/src/components/ReorderButton.css"],"relations":[{"type":"extends","to":"cart","note":"fills the cart from a previous order"},{"type":"depends-on","to":"orders","note":"reads the previous order's lines"},{"type":"depends-on","to":"catalog","note":"uses today's prices and availability"}],"summary":"\"Order again\" puts a previous order's items into the cart at today's prices,\nskips items no longer on sale, then opens the cart for edits. When the cart\nalready has items, the customer chooses whether to replace or add.","rules":[{"id":"R-REO-001","meta":{"tokens":["must"]},"text":"Reordering always uses today's prices and availability, never the old order's captured prices.","more":[]},{"id":"R-REO-002","meta":{"tokens":["must"]},"text":"The customer is told which items were skipped and whether any price changed.","more":[]},{"id":"R-REO-003","meta":{"tokens":["must"]},"text":"An existing cart is never silently overwritten. The customer picks replace or add.","more":[]}],"decisions":[{"id":"D-REO-001","meta":{"tokens":["confirmed"],"date":"2026-09-26"},"text":"Reorder goes through the cart (editable), not straight to a placed order (commit f99b425).","more":["Why: customers often tweak quantities, and a one-click order would skip the date and slot choice."]}],"questions":[],"ideas":[{"id":"I-REO-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Show an \"Order your usual\" shortcut on the home page for signed-in customers with a previous delivered order.","more":[]}]},{"file":"vault/nodes/reviews.md","id":"reviews","title":"Reviews & ratings","prefix":"REV","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/reviews/**","client/src/pages/OrderReview.tsx","client/src/pages/OrderReview.css","client/src/components/ProductReviews.tsx","client/src/components/ProductReviews.css","client/src/components/RatingStars.tsx","client/src/components/StarPicker.tsx","client/src/lib/reviews.ts","client/src/types/review.ts"],"relations":[{"type":"depends-on","to":"orders","note":"only delivered orders can be reviewed"},{"type":"feeds","to":"storefront","note":"top reviews, site rating, per-product averages"},{"type":"uses","to":"notifications","note":"the day-after review invite"}],"summary":"Reviews are tied to a delivered order: one per product in the order, plus one\noptional overall review. A rating is 1–5 whole stars (default 5) with optional\ntext. The day after delivery the customer is invited by notification and\nemail. Product averages and the site-wide rating exclude overall reviews.","rules":[{"id":"R-REV-001","meta":{"tokens":["must"]},"text":"Only the order's own customer can review, only once it is DELIVERED, and only products that order contains.","more":[]},{"id":"R-REV-002","meta":{"tokens":["must"]},"text":"Reviews are immutable. There is at most one per (order, product) and one overall per order, and they are never updated.","more":[]},{"id":"R-REV-003","meta":{"tokens":["must"]},"text":"The review invite is sent once per order, the day after delivery, and never for guest orders.","more":[]},{"id":"R-REV-004","meta":{"tokens":["must"]},"text":"Ratings shown on products and the site come from product reviews only, not overall reviews.","more":[]}],"decisions":[{"id":"D-REV-001","meta":{"tokens":["confirmed"],"date":"2026-09-13"},"text":"Make reviews order-based and immutable, with a default of 5 stars.","more":["Why: tying a review to a real delivered order makes every review verified. Immutability keeps ratings honest."]}],"questions":[],"ideas":[{"id":"I-REV-001","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Let the owner post a public reply under a review. Replying shows care, which is the brand promise.","more":[]},{"id":"I-REV-002","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Show \"Verified order\" on each review, since they all are.","more":[]}]},{"file":"vault/nodes/scheduled-jobs.md","id":"scheduled-jobs","title":"Scheduled housekeeping","prefix":"OPS","kind":"cross-cutting","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/maintenance/**","server/src/modules/reviews/review-invite.service.ts"],"relations":[{"type":"triggers","to":"reviews","note":"sends day-after review invites"},{"type":"triggers","to":"notifications","note":"the review invite is a notification"}],"summary":"Periodic jobs that are safe to repeat: sending review invites, deleting\nlegacy never-confirmed self-registered accounts (R-AUTH-005), and pruning expired rate-limit rows. Vercel Cron\ncalls `/api/internal/*` with `CRON_SECRET`, and a persistent host runs them on\na boot interval.","rules":[{"id":"R-OPS-001","meta":{"tokens":["must"]},"text":"Every job is idempotent and safe to run repeatedly.","more":[]},{"id":"R-OPS-002","meta":{"tokens":["must"]},"text":"The internal endpoint is disabled entirely when `CRON_SECRET` is unset, so it can never be triggered publicly.","more":[]}],"decisions":[{"id":"D-OPS-001","meta":{"tokens":["confirmed"],"date":"2026-09-15"},"text":"Run housekeeping through a secret-protected cron endpoint.","more":["Why: serverless hosting has no long-running process."]}],"questions":[],"ideas":[{"id":"I-OPS-001","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Add a \"tomorrow's orders\" morning summary job for the kitchen, as a push or email at 07:00.","more":[]}]},{"file":"vault/nodes/storefront.md","id":"storefront","title":"Storefront (home, menu, contact)","prefix":"SHOP","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["client/src/pages/CustomerHome.tsx","client/src/pages/Home.css","client/src/pages/ProductList.tsx","client/src/pages/ProductDetail.tsx","client/src/pages/Products.css","client/src/components/ProductCard.tsx","client/src/components/ProductCard.css","client/src/components/MenuByCategory.tsx","client/src/components/Header.tsx","client/src/components/Header.css","client/src/components/CoverageBanner.tsx","client/src/layouts/CustomerLayout.tsx"],"relations":[{"type":"depends-on","to":"catalog","note":"shows active products; sold-out ones carry a badge"},{"type":"uses","to":"reviews","note":"top reviews and site rating on the home page"},{"type":"uses","to":"cart","note":"add-to-cart from cards and the detail page"},{"type":"constrains","to":"design-system","note":"the hero, product cards and trust messaging are the brand's shop window"}],"summary":"The public shop: a home page (a hero with the top-rated products orbiting\nthe #1, trust points, featured dishes, real reviews), the product list with a\ncategory filter and infinite scroll, product detail pages, and the contact\npage. Guests and customers can browse, and admins can preview it.","rules":[{"id":"R-SHOP-001","meta":{"tokens":["must"]},"text":"Only real reviews are shown. Never display sample or dummy testimonials.","more":[]},{"id":"R-SHOP-002","meta":{"tokens":["must"]},"text":"Sold-out (`isAvailable = false`) products stay visible with a \"sold out\" badge but cannot be added to the cart. Inactive products are not shown.","more":[]},{"id":"R-SHOP-003","meta":{"tokens":["should"]},"text":"Food photography leads. A product with no image shows a category-matched emoji placeholder rather than a broken image.","more":[]},{"id":"R-SHOP-004","meta":{"tokens":["should"]},"text":"The brand voice is \"premium homemade\", not a generic restaurant: trust labels such as 100% Homemade, Fresh Ingredients and Hygienic.","more":[]},{"id":"R-SHOP-005","meta":{"tokens":["should"]},"text":"Menu cards stay standard size, with the big photo reserved for the product page. Lists of dishes are grouped or filterable by category.","more":[]}],"decisions":[{"id":"D-SHOP-001","meta":{"tokens":["confirmed"],"date":"2026-09-15"},"text":"Remove dummy home-page reviews and show only real ones.","more":["Why: fake social proof erodes trust, which is the whole proposition of a homemade-food brand."]},{"id":"D-SHOP-002","meta":{"tokens":["confirmed"],"date":"2026-09-13"},"text":"The hero showcases the top-rated products: #1 in the centre, the next three orbiting it.","more":["Why: it shows the actual menu instead of stock imagery."]},{"id":"D-SHOP-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Show the home page's popular dishes grouped by category, with a sticky chip bar (\"All\" shows each category as a section, most popular first), and use standard-size cards (square photo, name, rating, price, one-tap add). That's two per row on phones and five or six on desktop. The product page shows the dish large. Requested by the owner.","more":["Why: one large card per item showed too little of the menu."]}],"questions":[],"ideas":[{"id":"I-SHOP-001","meta":{"tokens":["new"],"impact":"high","effort":"M"},"text":"Show \"Order by 10 pm for tomorrow\" with a live countdown on the home page and product pages, from the ordering-window cutoff. The advance-order model is unusual, and making the deadline visible both explains it and adds healthy urgency.","more":[]},{"id":"I-SHOP-002","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Add a sticky \"View cart · ৳total\" bar on mobile once the cart has items, so customers don't have to hunt for the header icon.","more":[]},{"id":"I-SHOP-003","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Combo or bundle section (design.md lists one): let the admin group products into a combo with a bundle price, shown as a deep-red promo panel.","more":[]}]},{"file":"vault/nodes/translation.md","id":"translation","title":"Machine-translation fallback","prefix":"TRN","kind":"integration","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/translate/**","client/src/lib/translate.ts","client/src/context/TranslationContext.tsx"],"relations":[{"type":"feeds","to":"i18n","note":"fills in the missing language for single-language admin content"}],"summary":"A public, best-effort translation endpoint. When admin content (a product\nname, category or description) exists in only one language, the client asks\nfor a machine translation so the other language still reads naturally. The\nresults are cached for the life of the process, and the provider URL can be\noverridden with `TRANSLATE_URL`.","rules":[{"id":"R-TRN-001","meta":{"tokens":["must"]},"text":"Translation never throws and never blocks rendering. When it fails, the original text is shown.","more":[]},{"id":"R-TRN-002","meta":{"tokens":["should"]},"text":"An admin-entered English or Bangla value always wins over a machine translation.","more":[]}],"decisions":[{"id":"D-TRN-001","meta":{"tokens":["confirmed"],"date":"2026-09-15"},"text":"Use a pluggable endpoint template (`{sl}/{tl}/{q}`) with an in-process cache.","more":["Why: no paid API is needed to start, and the provider can be swapped (for example to self-hosted LibreTranslate) without code changes."]}],"questions":[],"ideas":[{"id":"I-TRN-001","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"In admin product forms, show the machine translation as a suggested English name the admin can accept with one click, so the stored English twin improves over time.","more":[]}]},{"file":"vault/nodes/user-management.md","id":"user-management","title":"User management (admin)","prefix":"USR","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/users/**","client/src/pages/admin/UsersAdmin.tsx","client/src/lib/users.ts"],"relations":[{"type":"extends","to":"access-control","note":"the only way to create ADMIN and KITCHEN accounts after seeding"},{"type":"uses","to":"email","note":"tells created users to sign in with the Google account for their email"}],"summary":"Admins create staff and customer accounts by **Google email**. There is no\npassword: the person signs in with Google, and that first sign-in confirms the\naccount. Each account records the admin who created it (a \"creator footprint\").\nThe user list shows each account's role, whether its owner has signed in yet,\nand its placeholder state.","rules":[{"id":"R-USR-001","meta":{"tokens":["must"]},"text":"Every admin-created account records `createdById`.","more":[]},{"id":"R-USR-002","meta":{"tokens":["must"]},"text":"Admin-created accounts have no password. The new user is emailed to sign in with the Google account for that email, so the admin must enter a Google (Gmail or Workspace) address.","more":[]}],"decisions":[{"id":"D-USR-001","meta":{"tokens":["superseded"],"date":"2026-09-15","by":"D-USR-002"},"text":"Stop emailing admin-set passwords. Send a set-your-own-password invite instead.","more":["Why: a password in an inbox is a security risk."]},{"id":"D-USR-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Remove the password from admin user creation. The created user signs in with Google (part of D-AUTH-004).","more":["Why: sign-in is Google only."]}],"questions":[],"ideas":[{"id":"I-USR-001","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Let an admin deactivate (`isActive = false`) a staff account from the list, with a confirmation step, instead of having to change credentials when a staff member leaves.","more":[]}]},{"file":"vault/nodes/wallet.md","id":"wallet","title":"Wallet (platform-wide ledger)","prefix":"WAL","kind":"feature","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/wallet/**","server/prisma/migrations/20261021120000_wallet_enum_values/**","server/prisma/migrations/20261021120100_wallet_and_simple_order_flow/**","client/src/lib/wallet.ts","client/src/types/payment.ts","client/src/pages/Wallet.tsx","client/src/pages/Wallet.css","client/src/pages/admin/WalletsAdmin.tsx","client/src/pages/admin/WalletDetailAdmin.tsx","client/src/components/WalletTimeline.tsx","client/src/components/ClaimForm.tsx","client/src/components/PayToUs.tsx","client/src/components/OrderPaymentBox.tsx","client/src/components/PayModePicker.tsx","client/src/components/Pay.css"],"relations":[{"type":"constrains","to":"checkout","note":"pay later is allowed only within the wallet limit"},{"type":"triggers","to":"orders","note":"a settled pay-first order confirms itself"},{"type":"feeds","to":"profit-reports","note":"payments and charges are the money record"},{"type":"uses","to":"notifications","note":"claim submitted / confirmed / rejected, adjustments"},{"type":"uses","to":"pricing-discounts","note":"WALLET_LIMIT promo codes raise the limit"},{"type":"extends","to":"payments","note":"replaces per-order payment rows with one customer ledger"}],"summary":"Every customer has one wallet: a signed ledger of what they owe and have\npaid. Orders are charged to it (pay later at once, pay first when paid, cash\non delivery when delivered). Customers pay manually (bKash, Nagad, Rocket,\nbank) and claim the payment with its reference, and an admin confirms it.\nAdmins can adjust any wallet with a reference. Every movement shows on a\ntimeline with a running balance. The wallet may go below zero by at most the\npay-later limit: ৳100 by default (admin-editable), raised temporarily by promo\ncodes. Positive credit is spent automatically on the next order.","rules":[{"id":"R-WAL-001","meta":{"tokens":["must"]},"text":"The balance is the sum of CONFIRMED `WalletEntry` amounts (+ money in, − money owed). PENDING claims and REJECTED entries never count.","more":[]},{"id":"R-WAL-002","meta":{"tokens":["must"]},"text":"Entries are never deleted or edited after review. Corrections are new ADJUSTMENT entries, so the timeline is a complete audit trail with who did what and when.","more":[]},{"id":"R-WAL-003","meta":{"tokens":["must"]},"text":"Every claim and every admin adjustment carries a reference (trx id, bank ref, receipt). A reference already used by a pending or confirmed payment is refused.","more":[]},{"id":"R-WAL-004","meta":{"tokens":["must"]},"text":"A pay-later order is accepted only if the balance after charging stays ≥ −(limit). The check runs under a per-customer row lock (`SELECT … FOR UPDATE`) so concurrent orders can't slip past it. A refused order leaves nothing behind.","more":[]},{"id":"R-WAL-005","meta":{"tokens":["must"]},"text":"The limit is `OrderingSetting.walletCreditLimit` (default ৳100) plus active `WalletLimitGrant`s. Grants come only from WALLET_LIMIT promo codes, once per customer per code, and expire after the code's `limitDays`.","more":[]},{"id":"R-WAL-006","meta":{"tokens":["must"]},"text":"A pay-first order settles (charge posted, PAID, auto-CONFIRMED) when the confirmed payments linked to it plus any free positive credit reach its total. Settlement runs after placement, claim confirmation, admin-recorded payments and positive adjustments.","more":[]},{"id":"R-WAL-007","meta":{"tokens":["must"]},"text":"Cash on delivery: marking the order DELIVERED posts the charge and the cash collected. A shortfall stays on the wallet (ON_WALLET).","more":[]},{"id":"R-WAL-008","meta":{"tokens":["must"]},"text":"Cancelling reverses the order's charge (ORDER_REFUND). Money already paid stays as wallet credit, which can be spent or paid back with a debit adjustment.","more":[]},{"id":"R-WAL-009","meta":{"tokens":["must"]},"text":"Guests have no wallet: they pay first or cash on delivery. Their entries have no customer and move to the account when they sign in with Google on the same email.","more":[]},{"id":"R-WAL-010","meta":{"tokens":["should"]},"text":"There is no online gateway. Customers see the business's payment accounts with one-tap copy for the account, amount and reference (the order number), then submit the TrxID.","more":[]}],"decisions":[{"id":"D-WAL-001","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Build a platform-wide wallet. The ৳100 default unpaid limit can be raised by promo codes. Customers claim manual payments with references, admins confirm or adjust with references, every transaction shows on a timeline, and orders use pay first, pay later or cash on delivery. Requested by the owner.","more":["Why: one place for all money between the business and each customer."]},{"id":"D-WAL-002","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Keep the ৳100 default limit, even though most single orders exceed it. Pay later is effectively for customers who received a limit-raising code.","more":["Why: owner's choice; it limits risk on new customers."]},{"id":"D-WAL-003","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Positive credit is allowed and spent automatically: a pay-first order covered by credit confirms at once.","more":["Why: owner's choice; advance payments and overpayments aren't lost."]},{"id":"D-WAL-004","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Promo codes raise the limit temporarily (for `limitDays`), not permanently.","more":["Why: owner's choice."]},{"id":"D-WAL-005","meta":{"tokens":["confirmed"],"date":"2026-10-21"},"text":"Guests can pay first or cash on delivery only. Pay later needs Google sign-in.","more":["Why: a wallet needs an account."]},{"id":"D-WAL-006","meta":{"tokens":["proposed"],"date":"2026-10-21"},"text":"Store the wallet as one signed `WalletEntry` ledger that replaces the `Payment` table. The migration converts old payments (SUCCESS → confirmed, PENDING → pending claim, FAILED/VOID → rejected, REFUNDED → debit adjustment), posts charges for orders that were owed, and credits orders that an admin had marked PAID by hand.","more":["Why: one source of truth; balances start out correct for existing customers."]},{"id":"D-WAL-007","meta":{"tokens":["proposed"],"date":"2026-10-21"},"text":"Settlement rule: payments linked to an order cover that order first, plus any *free* positive credit. Existing pay-later debt does not block a pay-first order the customer has paid for.","more":["Why: otherwise a customer who pays exactly for a pay-first order while owing ৳80 would never see it confirm."]},{"id":"D-WAL-008","meta":{"tokens":["proposed"],"date":"2026-10-21"},"text":"A COD order collected short at the door leaves the shortfall as wallet debt for an account, or PARTIALLY_PAID for a guest.","more":["Why: matches how the door actually works; nothing is silently written off."]}],"questions":[],"ideas":[{"id":"I-WAL-001","meta":{"tokens":["new"],"impact":"high","effort":"M"},"text":"Show the customer's balance and pay-later headroom on the cart page, before checkout, so pay later never comes as a surprise refusal.","more":[]},{"id":"I-WAL-002","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Remind customers with a balance owed (push and in-app) a day after delivery, with the amount and the copy-ready payment accounts.","more":[]},{"id":"I-WAL-003","meta":{"tokens":["new"],"impact":"med","effort":"M"},"text":"Let admins attach a screenshot of the bKash SMS or bank slip to a claim review, for disputes.","more":[]},{"id":"I-WAL-004","meta":{"tokens":["new"],"impact":"low","effort":"S"},"text":"Export a customer's wallet timeline as a printable statement (useful for corporate accounts such as Orbitax).","more":[]}]},{"file":"vault/nodes/web-push.md","id":"web-push","title":"Web Push (phone notifications)","prefix":"PSH","kind":"integration","status":"live","scope":"local","reviewed":"2026-10-21","code":["server/src/modules/push/**","client/src/lib/push.ts","client/src/components/PushSync.tsx","client/src/components/PushToggle.tsx","client/public/sw.js"],"relations":[{"type":"extends","to":"notifications","note":"delivers the same events as OS-level notifications"}],"summary":"Service-worker-based Web Push. It needs a VAPID keypair; without one the\nfeature is hidden and everything else works. Users opt in from Profile →\nPhone notifications, and are prompted automatically after signing in.\nSubscriptions are stored per device and pruned when they expire.","rules":[{"id":"R-PSH-001","meta":{"tokens":["must"]},"text":"If `VAPID_*` is unset, push is hidden and nothing else breaks.","more":[]},{"id":"R-PSH-002","meta":{"tokens":["must"]},"text":"`/push/public-key` is public and must be mounted before the blanket-auth routers (R-PLT-002).","more":[]},{"id":"R-PSH-003","meta":{"tokens":["should"]},"text":"Expired endpoints (404/410) are deleted on send.","more":[]}],"decisions":[{"id":"D-PSH-001","meta":{"tokens":["confirmed"],"date":"2026-09-20"},"text":"Add Web Push and auto-prompt after sign-in.","more":["Why: customers miss in-app notifications when the site is closed."]}],"questions":[],"ideas":[{"id":"I-PSH-001","meta":{"tokens":["new"],"impact":"med","effort":"S"},"text":"Prompt for push at the moment it is most valuable, right after an order is placed (\"Get notified when it's on the way?\"), instead of at sign-in.","more":[]}]}],"edges":[{"from":"access-control","type":"depends-on","to":"auth","note":"roles come from the authenticated user"},{"from":"access-control","type":"constrains","to":"storefront","note":"staff are redirected away from shopping pages, except in admin preview"},{"from":"access-control","type":"constrains","to":"orders","note":"staff accounts cannot place orders for themselves"},{"from":"addresses","type":"feeds","to":"checkout","note":"saved addresses auto-fill checkout"},{"from":"admin-console","type":"depends-on","to":"access-control","note":"admin only"},{"from":"admin-console","type":"uses","to":"orders","note":"counts per step and the needs-action list"},{"from":"admin-console","type":"uses","to":"wallet","note":"payments to review and money owed"},{"from":"admin-console","type":"constrains","to":"design-system","note":"admin surfaces use the same glass tokens"},{"from":"admin-orders","type":"extends","to":"orders","note":"admin-created orders follow the same lifecycle"},{"from":"admin-orders","type":"depends-on","to":"auth","note":"creates or reuses placeholder customer accounts by email"},{"from":"admin-orders","type":"constrains","to":"ordering-window","note":"admin orders ignore the cutoff and slot limits"},{"from":"analytics","type":"uses","to":"catalog","note":"product demand × profit classification"},{"from":"auth","type":"uses","to":"email","note":"the \"your account is ready, sign in with Google\" mail for admin-created accounts"},{"from":"auth","type":"triggers","to":"scheduled-jobs","note":"legacy never-confirmed self-registered accounts are cleaned up"},{"from":"auth","type":"extends","to":"access-control","note":"issues the JWT that carries the role"},{"from":"bkash","type":"feeds","to":"payments","note":"a successful execute records a SUCCESS payment"},{"from":"business-profile","type":"configures","to":"storefront","note":"name, tagline, logo and contact on every page"},{"from":"business-profile","type":"configures","to":"payments","note":"the manual-payment account numbers shown to customers"},{"from":"business-profile","type":"configures","to":"email","note":"branding in transactional mail"},{"from":"cart","type":"depends-on","to":"catalog","note":"items reference products and their current price"},{"from":"cart","type":"feeds","to":"checkout","note":"the cart's lines become the order request"},{"from":"catalog","type":"feeds","to":"pricing-discounts","note":"list price and optional sale price per product"},{"from":"catalog","type":"feeds","to":"kitchen","note":"what to make is grouped by product"},{"from":"catalog","type":"feeds","to":"inventory-costing","note":"each product can have a recipe"},{"from":"checkout","type":"depends-on","to":"cart","note":"the order is built from cart lines"},{"from":"checkout","type":"depends-on","to":"ordering-window","note":"date and time slot must be inside the allowed window"},{"from":"checkout","type":"depends-on","to":"delivery-coverage","note":"address area must be serviceable"},{"from":"checkout","type":"depends-on","to":"pricing-discounts","note":"server prices the order authoritatively"},{"from":"checkout","type":"uses","to":"wallet","note":"pay later needs headroom; wallet credit pays pay-first orders"},{"from":"checkout","type":"uses","to":"addresses","note":"pick a saved address or enter one"},{"from":"checkout","type":"triggers","to":"orders","note":"placing creates a PENDING order"},{"from":"checkout","type":"triggers","to":"notifications","note":"customer and admins are notified of a new order"},{"from":"delivery-coverage","type":"constrains","to":"checkout","note":"out-of-coverage addresses are blocked"},{"from":"delivery-coverage","type":"constrains","to":"addresses","note":"the area is picked from a zone-grouped selector"},{"from":"delivery-coverage","type":"extends","to":"orbitax-billing","note":"Orbitax accounts may also order to their Mohakhali office"},{"from":"delivery","type":"depends-on","to":"orders","note":"one delivery record per order"},{"from":"delivery","type":"feeds","to":"profit-reports","note":"delivery gain or loss per order"},{"from":"design-system","type":"constrains","to":"storefront","note":"every customer surface uses glass tokens and components"},{"from":"design-system","type":"constrains","to":"kitchen","note":"kitchen board statuses use semantic colours with icons"},{"from":"design-system","type":"constrains","to":"orders","note":"order and payment status pills are semantic, never palette-tinted"},{"from":"design-system","type":"depends-on","to":"i18n","note":"Bangla typography rules and bilingual palette names"},{"from":"email","type":"uses","to":"business-profile","note":"brand name and logo in mail"},{"from":"expenses","type":"feeds","to":"profit-reports","note":"other expenses reduce net profit"},{"from":"guest-checkout","type":"extends","to":"checkout","note":"the same flow without an account (POST /api/guest/orders)"},{"from":"guest-checkout","type":"feeds","to":"analytics","note":"guest orders are grouped into one \"Guest\" bucket"},{"from":"guest-checkout","type":"uses","to":"order-tracking","note":"the tracking link is how a guest follows the order"},{"from":"i18n","type":"uses","to":"translation","note":"single-language admin content is machine-translated as a fallback"},{"from":"i18n","type":"constrains","to":"design-system","note":"Bangla typography rules (no letter-spacing, taller line-height)"},{"from":"inventory-costing","type":"depends-on","to":"catalog","note":"recipes belong to products"},{"from":"inventory-costing","type":"feeds","to":"profit-reports","note":"per-unit product cost"},{"from":"kitchen","type":"depends-on","to":"orders","note":"only CONFIRMED and PREPARING orders are the kitchen's"},{"from":"kitchen","type":"triggers","to":"notifications","note":"line progress moves order status, which notifies the customer"},{"from":"kitchen","type":"uses","to":"ordering-window","note":"the day's orders are sorted by time slot"},{"from":"knowledge-vault","type":"constrains","to":"platform","note":"every change to the project goes through the vault protocol"},{"from":"notifications","type":"uses","to":"web-push","note":"the same events also go out as OS push"},{"from":"notifications","type":"uses","to":"wallet","note":"claim submitted / confirmed / rejected and adjustments"},{"from":"notifications","type":"uses","to":"email","note":"some events also send mail (confirmation, review invite)"},{"from":"notifications","type":"constrains","to":"i18n","note":"stored as message key + params so text follows the reader's language"},{"from":"orbitax-billing","type":"extends","to":"wallet","note":"Orbitax staff use the ordinary wallet (with a raised limit)"},{"from":"orbitax-billing","type":"uses","to":"pricing-discounts","note":"automatic Orbitax coupon"},{"from":"order-tracking","type":"depends-on","to":"orders","note":"renders order status as a timeline"},{"from":"order-tracking","type":"uses","to":"email","note":"the confirmation email carries the tracking link"},{"from":"order-tracking","type":"uses","to":"wallet","note":"payment shows as the next action (\"pay ৳X\", \"keep ৳X cash ready\"), never as a step"},{"from":"ordering-window","type":"constrains","to":"checkout","note":"earliest allowed date and open slots"},{"from":"ordering-window","type":"feeds","to":"kitchen","note":"orders are sorted by time slot on the board"},{"from":"orders","type":"depends-on","to":"wallet","note":"pay-first orders confirm once paid; charges and refunds go through the wallet"},{"from":"orders","type":"triggers","to":"kitchen","note":"CONFIRMED orders appear on the production board"},{"from":"orders","type":"triggers","to":"delivery","note":"dispatching records who delivers it"},{"from":"orders","type":"triggers","to":"notifications","note":"every status change notifies the customer"},{"from":"orders","type":"triggers","to":"order-tracking","note":"first confirmation emails the tracking link"},{"from":"orders","type":"triggers","to":"reviews","note":"DELIVERED stamps deliveredAt, which drives the review invite"},{"from":"orders","type":"feeds","to":"profit-reports","note":"captured totals are the revenue source"},{"from":"payments","type":"configures","to":"wallet","note":"the account numbers and methods customers pay by"},{"from":"payments","type":"configures","to":"checkout","note":"the three payment methods offered"},{"from":"platform","type":"uses","to":"scheduled-jobs","note":"housekeeping runs through the internal cron endpoint"},{"from":"pricing-discounts","type":"depends-on","to":"catalog","note":"list and sale prices"},{"from":"pricing-discounts","type":"configures","to":"ordering-window","note":"the default delivery charge is part of the order total"},{"from":"pricing-discounts","type":"feeds","to":"profit-reports","note":"food and delivery discounts are reported separately"},{"from":"profit-reports","type":"feeds","to":"analytics","note":"the same figures underpin customer and product analytics"},{"from":"reorder","type":"extends","to":"cart","note":"fills the cart from a previous order"},{"from":"reorder","type":"depends-on","to":"orders","note":"reads the previous order's lines"},{"from":"reorder","type":"depends-on","to":"catalog","note":"uses today's prices and availability"},{"from":"reviews","type":"depends-on","to":"orders","note":"only delivered orders can be reviewed"},{"from":"reviews","type":"feeds","to":"storefront","note":"top reviews, site rating, per-product averages"},{"from":"reviews","type":"uses","to":"notifications","note":"the day-after review invite"},{"from":"scheduled-jobs","type":"triggers","to":"reviews","note":"sends day-after review invites"},{"from":"scheduled-jobs","type":"triggers","to":"notifications","note":"the review invite is a notification"},{"from":"storefront","type":"depends-on","to":"catalog","note":"shows active products; sold-out ones carry a badge"},{"from":"storefront","type":"uses","to":"reviews","note":"top reviews and site rating on the home page"},{"from":"storefront","type":"uses","to":"cart","note":"add-to-cart from cards and the detail page"},{"from":"storefront","type":"constrains","to":"design-system","note":"the hero, product cards and trust messaging are the brand's shop window"},{"from":"translation","type":"feeds","to":"i18n","note":"fills in the missing language for single-language admin content"},{"from":"user-management","type":"extends","to":"access-control","note":"the only way to create ADMIN and KITCHEN accounts after seeding"},{"from":"user-management","type":"uses","to":"email","note":"tells created users to sign in with the Google account for their email"},{"from":"wallet","type":"constrains","to":"checkout","note":"pay later is allowed only within the wallet limit"},{"from":"wallet","type":"triggers","to":"orders","note":"a settled pay-first order confirms itself"},{"from":"wallet","type":"feeds","to":"profit-reports","note":"payments and charges are the money record"},{"from":"wallet","type":"uses","to":"notifications","note":"claim submitted / confirmed / rejected, adjustments"},{"from":"wallet","type":"uses","to":"pricing-discounts","note":"WALLET_LIMIT promo codes raise the limit"},{"from":"wallet","type":"extends","to":"payments","note":"replaces per-order payment rows with one customer ledger"},{"from":"web-push","type":"extends","to":"notifications","note":"delivers the same events as OS-level notifications"}]}
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim()
const kindColor = { feature: '--k-feature', 'cross-cutting': '--k-cross', integration: '--k-integration', meta: '--k-meta' }
const svg = document.getElementById('svg'), vp = document.getElementById('viewport')
const NS = 'http://www.w3.org/2000/svg'
const W = () => svg.clientWidth, H = () => svg.clientHeight
const deg = {}
G.edges.forEach((e) => { deg[e.from] = (deg[e.from] || 0) + 1; deg[e.to] = (deg[e.to] || 0) + 1 })
const nodes = G.nodes.map((n, i) => ({ ...n, x: W() / 2 + Math.cos(i) * 200, y: H() / 2 + Math.sin(i) * 200, vx: 0, vy: 0, r: 7 + Math.sqrt(deg[n.id] || 1) * 3 }))
const byId = Object.fromEntries(nodes.map((n) => [n.id, n]))
const links = G.edges.filter((e) => byId[e.from] && byId[e.to]).map((e) => ({ ...e, s: byId[e.from], t: byId[e.to] }))
document.getElementById('stats').innerHTML = `<p>${nodes.length} nodes · ${links.length} relations · ${nodes.reduce((s, n) => s + n.rules.length, 0)} rules · ${nodes.reduce((s, n) => s + n.ideas.length, 0)} ideas</p>`

const lineEls = links.map((l) => { const el = document.createElementNS(NS, 'line'); document.getElementById('edges').append(el); return el })
const nodeEls = nodes.map((n) => {
  const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'node'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', n.title)
  const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', n.r); c.setAttribute('fill', css(kindColor[n.kind] || '--k-feature'))
  const t = document.createElementNS(NS, 'text'); t.setAttribute('x', n.r + 4); t.setAttribute('y', 4); t.textContent = n.id
  g.append(c, t); document.getElementById('nodes').append(g)
  g.addEventListener('click', () => select(n.id)); g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') select(n.id) })
  g.addEventListener('pointerdown', (e) => { e.stopPropagation(); drag = n; n.fixed = true })
  return g
})

// --- tiny force simulation
let alpha = 1
function tick() {
  const cx = W() / 2, cy = H() / 2
  for (const a of nodes) for (const b of nodes) {
    if (a === b) continue
    const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01, f = (2600 / d2) * alpha
    a.vx += dx * f / Math.sqrt(d2); a.vy += dy * f / Math.sqrt(d2)
  }
  for (const l of links) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1, f = (d - 120) * 0.02 * alpha
    l.s.vx += dx / d * f; l.s.vy += dy / d * f; l.t.vx -= dx / d * f; l.t.vy -= dy / d * f
  }
  for (const n of nodes) {
    n.vx += (cx - n.x) * 0.004 * alpha; n.vy += (cy - n.y) * 0.004 * alpha
    if (!n.fixed) { n.x += n.vx; n.y += n.vy }
    n.vx *= 0.6; n.vy *= 0.6
  }
  alpha = Math.max(alpha * 0.985, 0.02)
}
function draw() {
  links.forEach((l, i) => { const el = lineEls[i]; el.setAttribute('x1', l.s.x); el.setAttribute('y1', l.s.y); el.setAttribute('x2', l.t.x); el.setAttribute('y2', l.t.y) })
  nodes.forEach((n, i) => nodeEls[i].setAttribute('transform', `translate(${n.x},${n.y})`))
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
if (reduce) { for (let i = 0; i < 400; i++) tick(); draw() } else (function loop() { tick(); draw(); requestAnimationFrame(loop) })()

// --- pan / zoom / drag
let drag = null, pan = null, view = { x: 0, y: 0, k: 1 }
const apply = () => vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`)
svg.addEventListener('pointerdown', (e) => { pan = { x: e.clientX - view.x, y: e.clientY - view.y } })
addEventListener('pointermove', (e) => {
  if (drag) { const r = svg.getBoundingClientRect(); drag.x = (e.clientX - r.left - view.x) / view.k; drag.y = (e.clientY - r.top - view.y) / view.k; alpha = Math.max(alpha, 0.3); if (reduce) draw() }
  else if (pan) { view.x = e.clientX - pan.x; view.y = e.clientY - pan.y; apply() }
})
addEventListener('pointerup', () => { if (drag) drag.fixed = false; drag = null; pan = null })
svg.addEventListener('wheel', (e) => { e.preventDefault(); const k = Math.min(3, Math.max(0.3, view.k * (e.deltaY < 0 ? 1.1 : 0.9))); const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; apply() }, { passive: false })

// --- panel
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const entry = (e) => `<li><b class="${esc(e.meta.tokens[0] || '')}">${esc(e.id)}</b> <span class="tag">${esc([...e.meta.tokens, e.meta.date, e.meta.impact && 'impact:' + e.meta.impact, e.meta.effort && 'effort:' + e.meta.effort].filter(Boolean).join(' · '))}</span><br>${esc(e.text)}${e.more.length ? '<br><span class="hint">' + e.more.map(esc).join('<br>') + '</span>' : ''}</li>`
const list = (title, arr) => arr.length ? `<h2>${title} (${arr.length})</h2><ul>${arr.map(entry).join('')}</ul>` : ''
function select(id) {
  const n = byId[id]; if (!n) return
  const near = new Set([id, ...links.filter((l) => l.from === id || l.to === id).flatMap((l) => [l.from, l.to])])
  nodes.forEach((m, i) => { nodeEls[i].classList.toggle('dim', !near.has(m.id)); nodeEls[i].classList.toggle('sel', m.id === id) })
  links.forEach((l, i) => lineEls[i].classList.toggle('hot', l.from === id || l.to === id))
  const rel = [...n.relations.map((r) => `<li>→ ${esc(r.type)} <a class="rel" data-id="${esc(r.to)}">${esc(r.to)}</a> — ${esc(r.note)}</li>`), ...links.filter((l) => l.to === id).map((l) => `<li>← <a class="rel" data-id="${esc(l.from)}">${esc(l.from)}</a> ${esc(l.type)} — ${esc(l.note)}</li>`)]
  document.getElementById('panel').innerHTML = `<h1>${esc(n.title)}</h1><span class="tag">${esc(n.id)}</span><span class="tag">${esc(n.kind)}</span><span class="tag">${esc(n.status)}</span><span class="tag">reviewed ${esc(n.reviewed)}</span><p>${esc(n.summary)}</p><p class="hint">${esc(n.file)}</p>${list('Rules', n.rules)}${list('Decisions', n.decisions)}${list('Open questions', n.questions)}${list('Ideas', n.ideas)}<h2>Relations</h2><ul>${rel.join('')}</ul>${n.code.length ? `<h2>Code</h2><ul>${n.code.map((c) => `<li><code>${esc(c)}</code></li>`).join('')}</ul>` : ''}`
  document.querySelectorAll('a.rel').forEach((a) => a.addEventListener('click', () => select(a.dataset.id)))
}
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim()
  nodes.forEach((n, i) => nodeEls[i].classList.toggle('dim', !!q && !JSON.stringify(n).toLowerCase().includes(q)))
})
if (location.hash) select(location.hash.slice(1))
</script>
